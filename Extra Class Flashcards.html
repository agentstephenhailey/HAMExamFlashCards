armonics?","answer":"Fourier analysis","sub":"E8A"},{"id":"E8A02","question":"Which of the following is a type of analog-to-digital conversion?","answer":"Successive approximation","sub":"E8A"},{"id":"E8A03","question":"Which of the following describes a signal in the time domain?","answer":"Amplitude at different times","sub":"E8A"},{"id":"E8A04","question":"What is \u201cdither\u201d with respect to analog-to-digital converters?","answer":"A small amount of noise added to the input signal to reduce quantization noise","sub":"E8A"},{"id":"E8A05","question":"What is the benefit of making voltage measurements with a true-RMS calculating meter?","answer":"RMS is measured for both sinusoidal and non-sinusoidal signals","sub":"E8A"},{"id":"E8A06","question":"What is the approximate ratio of PEP-to-average power in an unprocessed single-sideband phone signal?","answer":"2.5 to 1","sub":"E8A"},{"id":"E8A07","question":"What determines the PEP-to-average power ratio of an unprocessed single-sideband phone signal?","answer":"Speech characteristics","sub":"E8A"},{"id":"E8A08","question":"Why are direct or flash conversion analog-to-digital converters used for a software defined radio?","answer":"Very high speed allows digitizing high frequencies","sub":"E8A"},{"id":"E8A09","question":"How many different input levels can be encoded by an analog-to-digital converter with 8-bit resolution?","answer":"256","sub":"E8A"},{"id":"E8A10","question":"What is the purpose of a low-pass filter used at the output of a digital-to-analog converter?","answer":"Remove spurious sampling artifacts from the output signal","sub":"E8A"},{"id":"E8A11","question":"Which of the following is a measure of the quality of an analog-to-digital converter?","answer":"Total harmonic distortion","sub":"E8A"},{"id":"E8B01","question":"What is the modulation index of an FM signal?","answer":"The ratio of frequency deviation to modulating signal frequency","sub":"E8B"},{"id":"E8B02","question":"How does the modulation index of a phase-modulated emission vary with RF carrier frequency?","answer":"It does not depend on the RF carrier frequency","sub":"E8B"},{"id":"E8B03","question":"What is the modulation index of an FM phone signal having a maximum frequency deviation of 3000 Hz either side of the carrier frequency if the highest modulating frequency is 1000 Hz?","answer":"3","sub":"E8B"},{"id":"E8B04","question":"What is the modulation index of an FM phone signal having a maximum carrier deviation of plus or minus 6 kHz if the highest modulating frequency  is 2 kHz?","answer":"3","sub":"E8B"},{"id":"E8B05","question":"What is the deviation ratio of an FM phone signal having a maximum frequency swing of plus or minus 5 kHz if the highest modulation frequency is 3 kHz?","answer":"1.67","sub":"E8B"},{"id":"E8B06","question":"What is the deviation ratio of an FM phone signal having a maximum frequency swing of plus or minus 7.5 kHz if the highest modulation frequency is 3.5 kHz?","answer":"2.14","sub":"E8B"},{"id":"E8B07","question":"Orthogonal frequency-division multiplexing (OFDM) is a technique used for which types of amateur communication?","answer":"Digital modes","sub":"E8B"},{"id":"E8B08","question":"What describes orthogonal frequency-division multiplexing (OFDM)?","answer":"A digital modulation technique using subcarriers at frequencies chosen to avoid intersymbol interference","sub":"E8B"},{"id":"E8B09","question":"What is deviation ratio?","answer":"The ratio of the maximum carrier frequency deviation to the highest audio modulating frequency","sub":"E8B"},{"id":"E8B10","question":"What is frequency division multiplexing (FDM)?","answer":"Dividing the transmitted signal into separate frequency bands that each carry a different data stream","sub":"E8B"},{"id":"E8B11","question":"What is digital time division multiplexing?","answer":"Two or more signals are arranged to share discrete time slots of a data transmission","sub":"E8B"},{"id":"E8C01","question":"What is Quadrature Amplitude Modulation or QAM?","answer":"Transmission of data by modulating the amplitude of two carriers of the same frequency but 90 degrees out of phase","sub":"E8C"},{"id":"E8C02","question":"What is the definition of symbol rate in a digital transmission?","answer":"The rate at which the waveform changes to convey information","sub":"E8C"},{"id":"E8C03","question":"Why should the phase of a PSK signal be changed at the zero crossing of the RF signal?","answer":"To minimize bandwidth","sub":"E8C"},{"id":"E8C04","question":"What technique minimizes the bandwidth of a PSK31 signal?","answer":"Use of sinusoidal data pulses","sub":"E8C"},{"id":"E8C05","question":"What is the approximate bandwidth of a 13-WPM International Morse Code transmission?","answer":"52 Hz","sub":"E8C"},{"id":"E8C06","question":"What is the bandwidth of an FT8 signal?","answer":"50 Hz","sub":"E8C"},{"id":"E8C07","question":"What is the bandwidth of a 4,800-Hz frequency shift, 9,600-baud ASCII FM transmission?","answer":"15.36 kHz","sub":"E8C"},{"id":"E8C08","question":"How does ARQ accomplish error correction?","answer":"If errors are detected, a retransmission is requested","sub":"E8C"},{"id":"E8C09","question":"Which digital code allows only one bit to change between sequential code values?","answer":"Gray code","sub":"E8C"},{"id":"E8C10","question":"How can data rate be increased without increasing bandwidth?","answer":"Using a more efficient digital code","sub":"E8C"},{"id":"E8C11","question":"What is the relationship between symbol rate and baud?","answer":"They are the same","sub":"E8C"},{"id":"E8C12","question":"What factors affect the bandwidth of a transmitted CW signal?","answer":"Keying speed and shape factor (rise and fall time)","sub":"E8C"},{"id":"E8C13","question":"What is described by the constellation diagram of a QAM or QPSK signal?","answer":"The possible phase and amplitude states for each symbol","sub":"E8C"},{"id":"E8C14","question":"What type of addresses do nodes have in a mesh network?","answer":"Internet Protocol (IP)","sub":"E8C"},{"id":"E8C15","question":"What technique do individual nodes use to form a mesh network?","answer":"Discovery and link establishment protocols","sub":"E8C"},{"id":"E8D01","question":"Why are received spread spectrum signals resistant to interference?","answer":"Signals not using the spread spectrum algorithm are suppressed in the receiver","sub":"E8D"},{"id":"E8D02","question":"What spread spectrum communications technique uses a high-speed binary bit stream to shift the phase of an RF carrier?","answer":"Direct sequence","sub":"E8D"},{"id":"E8D03","question":"Which describes spread spectrum frequency hopping?","answer":"Rapidly varying the frequency of a transmitted signal according to a pseudorandom sequence","sub":"E8D"},{"id":"E8D04","question":"What is the primary effect of extremely short rise or fall time on a CW signal?","answer":"The generation of key clicks","sub":"E8D"},{"id":"E8D05","question":"What is the most common method of reducing key clicks?","answer":"Increase keying waveform rise and fall times","sub":"E8D"},{"id":"E8D06","question":"What is the advantage of including parity bits in ASCII characters?","answer":"Some types of errors can be detected","sub":"E8D"},{"id":"E8D07","question":"What is a common cause of overmodulation of AFSK signals?","answer":"Excessive transmit audio levels","sub":"E8D"},{"id":"E8D08","question":"What parameter evaluates distortion of an AFSK signal caused by excessive input audio levels?","answer":"Intermodulation Distortion (IMD)","sub":"E8D"},{"id":"E8D09","question":"What is considered an acceptable maximum IMD level for an idling PSK signal?","answer":"-30 dB","sub":"E8D"},{"id":"E8D10","question":"What are some of the differences between the Baudot digital code and ASCII?","answer":"Baudot uses 5 data bits per character, ASCII uses 7 or 8; Baudot uses 2 characters as letters/figures shift codes, ASCII has no letters/figures shift code","sub":"E8D"},{"id":"E8D11","question":"What is one advantage of using ASCII code for data communications?","answer":"It is possible to transmit both uppercase and lowercase text","sub":"E8D"},{"id":"E9A01","question":"What is an isotropic radiator?","answer":"A hypothetical, lossless antenna having equal radiation intensity in all directions used as a reference for antenna gain","sub":"E9A"},{"id":"E9A02","question":"What is the effective radiated power (ERP) of a repeater station with 150 watts transmitter power output, 2 dB feed line loss, 2.2 dB duplexer loss, and 7 dBd antenna gain?","answer":"286 watts","sub":"E9A"},{"id":"E9A03","question":"What term describing total radiated power takes into account all gains and losses?","answer":"Effective radiated power","sub":"E9A"},{"id":"E9A04","question":"Which of the following factors affect the feed point impedance of an antenna?","answer":"Antenna height","sub":"E9A"},{"id":"E9A05","question":"What does the term \u201cground gain\u201d mean?","answer":"An increase in signal strength from ground reflections in the environment of the antenna","sub":"E9A"},{"id":"E9A06","question":"What is the effective radiated power (ERP) of a repeater station with 200 watts transmitter power output, 4 dB feed line loss, 3.2 dB duplexer loss, 0.8 dB circulator loss, and 10 dBd antenna gain?","answer":"317 watts","sub":"E9A"},{"id":"E9A07","question":"What is the effective isotropic radiated power (EIRP) of a repeater station with 200 watts transmitter power output, 2 dB feed line loss, 2.8 dB duplexer loss, 1.2 dB circulator loss, and 7 dBi antenna gain?","answer":"252 watts","sub":"E9A"},{"id":"E9A08","question":"Which frequency band has the smallest first Fresnel zone?","answer":"5.8 GHz","sub":"E9A"},{"id":"E9A09","question":"What is antenna efficiency?","answer":"Radiation resistance divided by total resistance","sub":"E9A"},{"id":"E9A10","question":"Which of the following improves the efficiency of a ground-mounted quarter-wave vertical antenna?","answer":"Installing a ground radial system","sub":"E9A"},{"id":"E9A11","question":"Which of the following determines ground losses for a ground-mounted vertical antenna operating on HF?","answer":"Soil conductivity","sub":"E9A"},{"id":"E9A12","question":"How much gain does an antenna have compared to a half-wavelength dipole if it has 6 dB gain over an isotropic radiator?","answer":"3.85 dB","sub":"E9A"},{"id":"E9B01","question":"What is the 3 dB beamwidth of the antenna radiation pattern shown in Figure E9-1?","answer":"50 degrees","sub":"E9B"},{"id":"E9B02","question":"What is the front-to-back ratio of the antenna radiation pattern shown in Figure E9-1?","answer":"18 dB","sub":"E9B"},{"id":"E9B03","question":"What is the front-to-side ratio of the antenna radiation pattern shown in Figure E9-1?","answer":"14 dB","sub":"E9B"},{"id":"E9B04","question":"What is the front-to-back ratio of the radiation pattern shown in Figure E9-2?","answer":"28 dB","sub":"E9B"},{"id":"E9B05","question":"What type of antenna pattern is shown in Figure E9-2?","answer":"Elevation","sub":"E9B"},{"id":"E9B06","question":"What is the elevation angle of peak response in the antenna radiation pattern shown in Figure E9-2?","answer":"7.5 degrees","sub":"E9B"},{"id":"E9B07","question":"What is the difference in radiated power between a lossless antenna with gain and an isotropic radiator driven by the same power?","answer":"They are the same","sub":"E9B"},{"id":"E9B08","question":"What is the far field of an antenna?","answer":"The region where the shape of the radiation pattern no longer varies with distance","sub":"E9B"},{"id":"E9B09","question":"What type of analysis is commonly used for modeling antennas?","answer":"Method of Moments","sub":"E9B"},{"id":"E9B10","question":"What is the principle of a Method of Moments analysis?","answer":"A wire is modeled as a series of segments, each having a uniform value of current","sub":"E9B"},{"id":"E9B11","question":"What is a disadvantage of decreasing the number of wire segments in an antenna model below 10 segments per half-wavelength?","answer":"The computed feed point impedance may be incorrect","sub":"E9B"},{"id":"E9C01","question":"What type of radiation pattern is created by two 1/4-wavelength vertical antennas spaced 1/2-wavelength apart and fed 180 degrees out of phase?","answer":"A figure-eight oriented along the axis of the array","sub":"E9C"},{"id":"E9C02","question":"What type of radiation pattern is created by two 1/4-wavelength vertical antennas spaced 1/4-wavelength apart and fed 90 degrees out of phase?","answer":"Cardioid","sub":"E9C"},{"id":"E9C03","question":"What type of radiation pattern is created by two 1/4-wavelength vertical antennas spaced 1/2-wavelength apart and fed in phase?","answer":"A figure-eight broadside to the axis of the array","sub":"E9C"},{"id":"E9C04","question":"What happens to the radiation pattern of an unterminated long wire antenna as the wire length is increased?","answer":"Additional lobes form with major lobes increasingly aligned with the axis of the antenna","sub":"E9C"},{"id":"E9C05","question":"What is the purpose of feeding an off-center-fed dipole (OCFD) between the center and one end instead of at the midpoint?","answer":"To create a similar feed point impedance on multiple bands","sub":"E9C"},{"id":"E9C06","question":"What is the effect of adding a terminating resistor to a rhombic or long-wire antenna?","answer":"It changes the radiation pattern from bidirectional to unidirectional","sub":"E9C"},{"id":"E9C07","question":"What is the approximate feed point impedance at the center of a two-wire half-wave folded dipole antenna?","answer":"300 ohms","sub":"E9C"},{"id":"E9C08","question":"What is a folded dipole antenna?","answer":"A half-wave dipole with an additional parallel wire connecting its two ends","sub":"E9C"},{"id":"E9C09","question":"Which of the following describes a G5RV antenna?","answer":"A wire antenna center-fed through a specific length of open-wire line connected to a balun and coaxial feed line","sub":"E9C"},{"id":"E9C10","question":"Which of the following describes a Zepp antenna?","answer":"An end-fed half-wavelength dipole","sub":"E9C"},{"id":"E9C11","question":"How is the far-field elevation pattern of a vertically polarized antenna affected by being mounted over seawater versus soil?","answer":"Radiation at low angles increases","sub":"E9C"},{"id":"E9C12","question":"Which of the following describes an extended double Zepp antenna?","answer":"A center-fed 1.25-wavelength dipole antenna","sub":"E9C"},{"id":"E9C13","question":"How does the radiation pattern of a horizontally polarized antenna vary with increasing height above ground?","answer":"The takeoff angle of the lowest elevation lobe decreases","sub":"E9C"},{"id":"E9C14","question":"How does the radiation pattern of a horizontally-polarized antenna mounted above a long slope compare with the same antenna mounted above flat ground?","answer":"The main lobe takeoff angle decreases in the downhill direction","sub":"E9C"},{"id":"E9D01","question":"How much does the gain of an ideal parabolic reflector antenna increase when the operating frequency is doubled?","answer":"6 dB","sub":"E9D"},{"id":"E9D02","question":"How can two linearly polarized Yagi antennas be used to produce circular polarization?","answer":"Arrange two Yagis on the same axis and perpendicular to each other with the driven elements at the same point on the boom and fed 90 degrees out of phase","sub":"E9D"},{"id":"E9D03","question":"What is the most efficient location for a loading coil on an electrically short whip?","answer":"Near the center of the vertical radiator","sub":"E9D"},{"id":"E9D04","question":"Why should antenna loading coils have a high ratio of reactance to resistance?","answer":"To maximize efficiency","sub":"E9D"},{"id":"E9D05","question":"Approximately how long is a Yagi\u2019s driven element?","answer":"1/2 wavelength","sub":"E9D"},{"id":"E9D06","question":"What happens to SWR bandwidth when one or more loading coils are used to resonate an electrically short antenna?","answer":"It is decreased","sub":"E9D"},{"id":"E9D07","question":"What is an advantage of top loading an electrically short HF vertical antenna?","answer":"Improved radiation efficiency","sub":"E9D"},{"id":"E9D08","question":"What happens as the Q of an antenna increases?","answer":"SWR bandwidth decreases","sub":"E9D"},{"id":"E9D09","question":"What is the function of a loading coil in an electrically short antenna?","answer":"To resonate the antenna by cancelling the capacitive reactance","sub":"E9D"},{"id":"E9D10","question":"How does radiation resistance of a base-fed whip antenna change below its resonant frequency?","answer":"Radiation resistance decreases","sub":"E9D"},{"id":"E9D11","question":"Why do most two-element Yagis with normal spacing have a reflector instead of a director?","answer":"Higher gain","sub":"E9D"},{"id":"E9D12","question":"What is the purpose of making a Yagi\u2019s parasitic elements either longer or shorter than resonance?","answer":"Control of phase shift","sub":"E9D"},{"id":"E9E01","question":"Which matching system for Yagi antennas requires the driven element to be insulated from the boom?","answer":"Beta or hairpin","sub":"E9E"},{"id":"E9E02","question":"What antenna matching system matches coaxial cable to an antenna by connecting the shield to the center of the antenna and the conductor a fraction of a wavelength to one side?","answer":"Gamma match","sub":"E9E"},{"id":"E9E03","question":"What matching system uses a short length of transmission line connected in parallel with the feed line at or near the feed point?","answer":"Stub match","sub":"E9E"},{"id":"E9E04","question":"What is the purpose of the series capacitor in a gamma match?","answer":"To cancel unwanted inductive reactance","sub":"E9E"},{"id":"E9E05","question":"What Yagi driven element feed point impedance is required to use a beta or hairpin matching system?","answer":"Capacitive (driven element electrically shorter than 1/2 wavelength)","sub":"E9E"},{"id":"E9E06","question":"Which of these transmission line impedances would be suitable for constructing a quarter-wave Q-section for matching a 100-ohm feed point impedance to a 50-ohm transmission line?","answer":"75 ohms","sub":"E9E"},{"id":"E9E07","question":"What parameter describes the interaction of a load and transmission line?","answer":"Reflection coefficient","sub":"E9E"},{"id":"E9E08","question":"What is a use for a Wilkinson divider?","answer":"To divide power equally between two 50-ohm loads while maintaining 50-ohm input impedance","sub":"E9E"},{"id":"E9E09","question":"Which of the following is used to shunt feed a grounded tower at its base?","answer":"Gamma match","sub":"E9E"},{"id":"E9E11","question":"What is the purpose of using multiple driven elements connected through phasing lines?","answer":"To control the antenna\u2019s radiation pattern","sub":"E9E"},{"id":"E9F01","question":"What is the velocity factor of a transmission line?","answer":"The velocity of a wave in the transmission line divided by the velocity of light in a vacuum","sub":"E9F"},{"id":"E9F02","question":"Which of the following has the biggest effect on the velocity factor of a transmission line?","answer":"The insulating dielectric material","sub":"E9F"},{"id":"E9F03","question":"Why is the electrical length of a coaxial cable longer than its physical length?","answer":"Electromagnetic waves move more slowly in a coaxial cable than in air","sub":"E9F"},{"id":"E9F04","question":"What impedance does a 1/2-wavelength transmission line present to an RF generator when the line is shorted at the far end?","answer":"Very low impedance","sub":"E9F"},{"id":"E9F05","question":"What is microstrip?","answer":"Precision printed circuit conductors above a ground plane that provide constant impedance interconnects at microwave frequencies","sub":"E9F"},{"id":"E9F06","question":"What is the approximate physical length of an air-insulated, parallel conductor transmission line that is electrically 1/2 wavelength long at 14.10 MHz?","answer":"10.6 meters","sub":"E9F"},{"id":"E9F07","question":"How does parallel conductor transmission line compare to coaxial cable with a plastic dielectric?","answer":"Lower loss","sub":"E9F"},{"id":"E9F08","question":"Which of the following is a significant difference between foam dielectric coaxial cable and solid dielectric coaxial cable, assuming all other parameters are the same?","answer":"All these choices are correct","sub":"E9F"},{"id":"E9F09","question":"What impedance does a 1/4-wavelength transmission line present to an RF generator when the line is shorted at the far end?","answer":"Very high impedance","sub":"E9F"},{"id":"E9F10","question":"What impedance does a 1/8-wavelength transmission line present to an RF generator when the line is shorted at the far end?","answer":"An inductive reactance","sub":"E9F"},{"id":"E9F11","question":"What impedance does a 1/8-wavelength transmission line present to an RF generator when the line is open at the far end?","answer":"A capacitive reactance","sub":"E9F"},{"id":"E9F12","question":"What impedance does a 1/4-wavelength transmission line present to an RF generator when the line is open at the far end?","answer":"Very low impedance","sub":"E9F"},{"id":"E9G01","question":"Which of the following can be calculated using a Smith chart?","answer":"Impedance along transmission lines","sub":"E9G"},{"id":"E9G02","question":"What type of coordinate system is used in a Smith chart?","answer":"Resistance circles and reactance arcs","sub":"E9G"},{"id":"E9G03","question":"Which of the following is often determined using a Smith chart?","answer":"Impedance and SWR values in transmission lines","sub":"E9G"},{"id":"E9G04","question":"What are the two families of circles and arcs that make up a Smith chart?","answer":"Resistance and reactance","sub":"E9G"},{"id":"E9G05","question":"Which of the following is a common use for a Smith chart?","answer":"Determine the length and position of an impedance matching stub","sub":"E9G"},{"id":"E9G06","question":"On the Smith chart shown in Figure E9-3, what is the name for the large outer circle on which the reactance arcs terminate?","answer":"Reactance axis","sub":"E9G"},{"id":"E9G07","question":"On the Smith chart shown in Figure E9-3, what is the only straight line shown?","answer":"The resistance axis","sub":"E9G"},{"id":"E9G08","question":"How is a Smith chart normalized?","answer":"Reassign the prime center\u2019s impedance value","sub":"E9G"},{"id":"E9G09","question":"What third family of circles is often added to a Smith chart during the process of designing impedance matching networks?","answer":"Constant-SWR circles","sub":"E9G"},{"id":"E9G10","question":"What do the arcs on a Smith chart represent?","answer":"Points with constant reactance","sub":"E9G"},{"id":"E9G11","question":"In what units are the wavelength scales on a Smith chart calibrated?","answer":"In fractions of transmission line electrical wavelength","sub":"E9G"},{"id":"E9H01","question":"When constructing a Beverage antenna, which of the following factors should be included in the design to achieve good performance at the desired frequency?","answer":"It should be at least one wavelength long","sub":"E9H"},{"id":"E9H02","question":"Which is generally true for 160- and 80-meter receiving antennas?","answer":"Atmospheric noise is so high that directivity is much more important than losses","sub":"E9H"},{"id":"E9H03","question":"What is receiving directivity factor (RDF)?","answer":"Peak antenna gain compared to average gain over the hemisphere around and above the antenna","sub":"E9H"},{"id":"E9H04","question":"What is the purpose of placing an electrostatic shield around a small-loop direction-finding antenna?","answer":"It eliminates unbalanced capacitive coupling to the antenna\u2019s surroundings, improving the depth of its nulls","sub":"E9H"},{"id":"E9H05","question":"What challenge is presented by a small wire-loop antenna for direction finding?","answer":"It has a bidirectional null pattern","sub":"E9H"},{"id":"E9H06","question":"What indicates the correct value of terminating resistance for a Beverage antenna?","answer":"Minimum variation in SWR over the desired frequency range","sub":"E9H"},{"id":"E9H07","question":"What is the function of a Beverage antenna\u2019s termination resistor?","answer":"Absorb signals from the reverse direction","sub":"E9H"},{"id":"E9H08","question":"What is the function of a sense antenna?","answer":"It modifies the pattern of a DF antenna to provide a null in only one direction","sub":"E9H"},{"id":"E9H09","question":"What type of radiation pattern is created by a single-turn, terminated loop such as a pennant antenna?","answer":"Cardioid","sub":"E9H"},{"id":"E9H10","question":"How can the output voltage of a multiple-turn receiving loop antenna be increased?","answer":"By increasing the number of turns and/or the area enclosed by the loop","sub":"E9H"},{"id":"E9H11","question":"What feature of a cardioid pattern antenna makes it useful for direction-finding antennas?","answer":"A single null","sub":"E9H"},{"id":"E0A01","question":"What is the primary function of an external earth connection or ground rod?","answer":"Lightning charge dissipation","sub":"E0A"},{"id":"E0A02","question":"When evaluating RF exposure levels from your station at a neighbor\u2019s home, what must you do?","answer":"Ensure signals from your station are less than the uncontrolled maximum permissible exposure (MPE) limits","sub":"E0A"},{"id":"E0A03","question":"Over what range of frequencies are the FCC human body RF exposure limits most restrictive?","answer":"30 - 300 MHz","sub":"E0A"},{"id":"E0A04","question":"When evaluating a site with multiple transmitters operating at the same time, the operators and licensees of which transmitters are responsible for mitigating over-exposure situations?","answer":"Each transmitter that produces 5 percent or more of its MPE limit in areas where the total MPE limit is exceeded","sub":"E0A"},{"id":"E0A05","question":"What hazard is created by operating at microwave frequencies?","answer":"The high gain antennas commonly used can result in high exposure levels","sub":"E0A"},{"id":"E0A06","question":"Why are there separate electric (E) and magnetic (H) MPE limits at frequencies below 300 MHz?","answer":"All these choices are correct","sub":"E0A"},{"id":"E0A07","question":"What is meant by \u201c100% tie-off\u201d regarding tower safety?","answer":"At least one lanyard attached to the tower at all times","sub":"E0A"},{"id":"E0A08","question":"What does SAR measure?","answer":"The rate at which RF energy is absorbed by the body","sub":"E0A"},{"id":"E0A09","question":"Which of the following types of equipment are exempt from RF exposure evaluations?","answer":"Hand-held transceivers sold before May 3, 2021","sub":"E0A"},{"id":"E0A10","question":"When must an RF exposure evaluation be performed on an amateur station operating on 80 meters?","answer":"An evaluation must always be performed","sub":"E0A"},{"id":"E0A11","question":"To what should lanyards be attached while climbing?","answer":"Tower legs","sub":"E0A"},{"id":"E0A12","question":"Where should a shock-absorbing lanyard be attached to a tower when working above ground?","answer":"Above the climber\u2019s head level","sub":"E0A"}];
let pool = [...CARDS];
let idx = 0;
function show(){
  if(!pool.length) return;
  const c = pool[idx];
  document.getElementById("question").textContent = c.question;
  document.getElementById("answer").textContent = c.answer;
  document.getElementById("answer").classList.remove("show");
  document.getElementById("revealBtn").textContent = "Show Answer";
  document.getElementById("stats").textContent = `Card ${idx+1} of ${pool.length}`;
  document.getElementById("meta").textContent = c.id + " (" + c.sub + ")";
}
document.getElementById("revealBtn").onclick = () => {
  document.getElementById("answer").classList.add("show");
  document.getElementById("revealBtn").textContent = "Answer Shown";
};
document.getElementById("nextBtn").onclick = () => {
  idx = (idx + 1) % pool.length;
  show();
};
document.getElementById("shuffleBtn").onclick = () => {
  for(let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  idx = 0;
  show();
};
document.getElementById("restartBtn").onclick = () => {
  pool = [...CARDS];
  idx = 0;
  show();
};
show();
</script>
