const CARDS = [{"id":"E1A01","question":"Why is it not legal to transmit a 3 kHz bandwidth USB signal with a carrier frequency of 14.348 MHz?","answer":"The upper 1 kHz of the signal is outside the 20-meter band","sub":"E1A"},{"id":"E1A02","question":"When using a transceiver that displays the carrier frequency of phone signals, which of the following displayed frequencies represents the lowest frequency at which a properly adjusted LSB emission will be totally within the band?","answer":"3 kHz above the lower band edge","sub":"E1A"},{"id":"E1A03","question":"What is the highest legal carrier frequency on the 20-meter band for transmitting a 2.8 kHz wide USB data signal?","answer":"14.1472 MHz","sub":"E1A"},{"id":"E1A04","question":"May an Extra class operator answer the CQ of a station on 3.601 MHz LSB phone?","answer":"No, the sideband components will extend beyond the edge of the phone band segment","sub":"E1A"},{"id":"E1A05","question":"Who must be in physical control of the station apparatus of an amateur station aboard any vessel or craft that is documented or registered in the United States?","answer":"Any person holding an FCC issued amateur license or who is authorized for alien reciprocal operation","sub":"E1A"},{"id":"E1A06","question":"What is the required transmit frequency of a CW signal for channelized 60 meter operation?","answer":"At the center frequency of the channel","sub":"E1A"},{"id":"E1A07","question":"What is the maximum power permitted on the 2200-meter band?","answer":"1 watt EIRP (equivalent isotropic radiated power)","sub":"E1A"},{"id":"E1A08","question":"If a station in a message forwarding system inadvertently forwards a message that is in violation of FCC rules, who is primarily accountable for the rules violation?","answer":"The control operator of the originating station","sub":"E1A"},{"id":"E1A09","question":"Except in some parts of Alaska, what is the maximum power permitted on the 630-meter band?","answer":"5 watts EIRP (equivalent isotropic radiated power)","sub":"E1A"},{"id":"E1A10","question":"If an amateur station is installed aboard a ship or aircraft, what condition must be met before the station is operated?","answer":"Its operation must be approved by the master of the ship or the pilot in command of the aircraft","sub":"E1A"},{"id":"E1A11","question":"What licensing is required when operating an amateur station aboard a US-registered vessel in international waters?","answer":"Any FCC-issued amateur license","sub":"E1A"},{"id":"E1B01","question":"Which of the following constitutes a spurious emission?","answer":"An emission outside the signal\u2019s necessary bandwidth that can be reduced or eliminated without affecting the information transmitted","sub":"E1B"},{"id":"E1B02","question":"Which of the following is an acceptable bandwidth for digital voice or slow-scan TV transmissions made on the HF amateur bands?","answer":"3 kHz","sub":"E1B"},{"id":"E1B03","question":"Within what distance must an amateur station protect an FCC monitoring facility from harmful interference?","answer":"1 mile","sub":"E1B"},{"id":"E1B04","question":"What must the control operator of a repeater operating in the 70-centimeter band do if a radiolocation system experiences interference from that repeater?","answer":"Cease operation or make changes to the repeater that mitigate the interference","sub":"E1B"},{"id":"E1B05","question":"What is the National Radio Quiet Zone?","answer":"An area surrounding the National Radio Astronomy Observatory","sub":"E1B"},{"id":"E1B06","question":"Which of the following additional rules apply if you are erecting an amateur station antenna structure at a site at or near a public use airport?","answer":"You may have to notify the Federal Aviation Administration and register it with the FCC as required by Part 17 of the FCC rules","sub":"E1B"},{"id":"E1B07","question":"To what type of regulations does PRB-1 apply?","answer":"State and local zoning","sub":"E1B"},{"id":"E1B08","question":"What limitations may the FCC place on an amateur station if its signal causes interference to domestic broadcast reception, assuming that the receivers involved are of good engineering design?","answer":"The amateur station must avoid transmitting during certain hours on frequencies that cause the interference","sub":"E1B"},{"id":"E1B09","question":"Which amateur stations may be operated under RACES rules?","answer":"Any FCC-licensed amateur station certified by the responsible civil defense organization for the area served","sub":"E1B"},{"id":"E1B10","question":"What frequencies are authorized to an amateur station operating under RACES rules?","answer":"All amateur service frequencies authorized to the control operator","sub":"E1B"},{"id":"E1B11","question":"What does PRB-1 require of state and local regulations affecting amateur radio antenna size and structures?","answer":"Reasonable accommodations of amateur radio must be made","sub":"E1B"},{"id":"E1C01","question":"What is the maximum bandwidth for a data emission on 60 meters?","answer":"2.8 kHz","sub":"E1C"},{"id":"E1C02","question":"Which of the following apply to communications transmitted to amateur stations in foreign countries?","answer":"Communications must be limited to those incidental to the purpose of the amateur service and remarks of a personal nature","sub":"E1C"},{"id":"E1C03","question":"How long must an operator wait after filing a notification with the Utilities Technology Council (UTC) before operating on the 2200-meter or 630-meter band?","answer":"Operators may operate after 30 days, providing they have not been told that their station is within 1 kilometer of PLC systems using those frequencies","sub":"E1C"},{"id":"E1C04","question":"What is an IARP?","answer":"A permit that allows US amateurs to operate in certain countries of the Americas","sub":"E1C"},{"id":"E1C05","question":"Under what situation may a station transmit third party communications while being automatically controlled?","answer":"Only when transmitting RTTY or data emissions","sub":"E1C"},{"id":"E1C06","question":"Which of the following is required in order to operate in accordance with CEPT rules in foreign countries where permitted?","answer":"You must have a copy of FCC Public Notice DA 16-1048","sub":"E1C"},{"id":"E1C07","question":"What notifications must be given before transmitting on the 630- or 2200-meter bands?","answer":"Operators must inform the Utilities Technology Council (UTC) of their call sign and coordinates of the station","sub":"E1C"},{"id":"E1C08","question":"What is the maximum permissible duration of a remotely controlled station\u2019s transmissions if its control link malfunctions?","answer":"3 minutes","sub":"E1C"},{"id":"E1C09","question":"What is the highest modulation index permitted at the highest modulation frequency for angle modulation below 29.0 MHz?","answer":"1.0","sub":"E1C"},{"id":"E1C10","question":"What is the maximum mean power level for a spurious emission below 30 MHz with respect to the fundamental emission?","answer":"- 43 dB","sub":"E1C"},{"id":"E1C11","question":"Which of the following operating arrangements allows an FCC-licensed US citizen to operate in many European countries, and amateurs from many European countries to operate in the US?","answer":"CEPT","sub":"E1C"},{"id":"E1C12","question":"In what portion of the 630-meter band are phone emissions permitted?","answer":"The entire band","sub":"E1C"},{"id":"E1D01","question":"What is the definition of telemetry?","answer":"One-way transmission of measurements at a distance from the measuring instrument","sub":"E1D"},{"id":"E1D02","question":"Which of the following may transmit encrypted messages?","answer":"Telecommand signals from a space telecommand station","sub":"E1D"},{"id":"E1D03","question":"What is a space telecommand station?","answer":"An amateur station that transmits communications to initiate, modify, or terminate functions of a space station","sub":"E1D"},{"id":"E1D04","question":"Which of the following is required in the identification transmissions from a balloon-borne telemetry station?","answer":"Call sign","sub":"E1D"},{"id":"E1D05","question":"What must be posted at the location of a station being operated by telecommand on or within 50 kilometers of the Earth\u2019s surface?","answer":"All these choices are correct","sub":"E1D"},{"id":"E1D06","question":"What is the maximum permitted transmitter output power when operating a model craft by telecommand?","answer":"1 watt","sub":"E1D"},{"id":"E1D07","question":"Which of the following HF amateur bands include allocations for space stations?","answer":"40 meters, 20 meters, 15 meters, and 10 meters","sub":"E1D"},{"id":"E1D08","question":"Which VHF amateur bands have frequencies authorized for space stations?","answer":"2 meters","sub":"E1D"},{"id":"E1D09","question":"Which UHF amateur bands have frequencies authorized for space stations?","answer":"70 centimeters and 13 centimeters","sub":"E1D"},{"id":"E1D10","question":"Which amateur stations are eligible to be telecommand stations of space stations, subject to the privileges of the class of operator license held by the control operator of the station?","answer":"Any amateur station so designated by the space station licensee","sub":"E1D"},{"id":"E1D11","question":"Which amateur stations are eligible to operate as Earth stations?","answer":"Any amateur station, subject to the privileges of the class of operator license held by the control operator","sub":"E1D"},{"id":"E1D12","question":"Which of the following amateur stations may transmit one-way communications?","answer":"A space station, beacon station, or telecommand station","sub":"E1D"},{"id":"E1E01","question":"For which types of out-of-pocket expenses do the Part 97 rules state that VEs and VECs may be reimbursed?","answer":"Preparing, processing, administering, and coordinating an examination for an amateur radio operator license","sub":"E1E"},{"id":"E1E02","question":"Who is tasked by Part 97 with maintaining the pools of questions for all US amateur license examinations?","answer":"The VECs","sub":"E1E"},{"id":"E1E03","question":"What is a Volunteer Examiner Coordinator?","answer":"An organization that has entered into an agreement with the FCC to coordinate, prepare, and administer amateur operator license examinations","sub":"E1E"},{"id":"E1E04","question":"What is required to be accredited as a Volunteer Examiner?","answer":"A VEC must confirm that the VE applicant meets FCC requirements to serve as an examiner","sub":"E1E"},{"id":"E1E05","question":"What must the VE team do with the application form if the examinee does not pass the exam?","answer":"Return the application document to the examinee","sub":"E1E"},{"id":"E1E06","question":"Who is responsible for the proper conduct and necessary supervision during an amateur operator license examination session?","answer":"Each administering VE","sub":"E1E"},{"id":"E1E07","question":"What should a VE do if a candidate fails to comply with the examiner\u2019s instructions during an amateur operator license examination?","answer":"Immediately terminate the candidate\u2019s examination","sub":"E1E"},{"id":"E1E08","question":"To which of the following examinees may a VE not administer an examination?","answer":"Relatives of the VE as listed in the FCC rules","sub":"E1E"},{"id":"E1E09","question":"What may be the penalty for a VE who fraudulently administers or certifies an examination?","answer":"Revocation of the VE\u2019s amateur station license grant and the suspension of the VE\u2019s amateur operator license grant","sub":"E1E"},{"id":"E1E10","question":"What must the administering VEs do after the administration of a successful examination for an amateur operator license?","answer":"They must submit the application document to the coordinating VEC according to the coordinating VEC instructions","sub":"E1E"},{"id":"E1E11","question":"What must the VE team do if an examinee scores a passing grade on all examination elements needed for an upgrade or new license?","answer":"Three VEs must certify that the examinee is qualified for the license grant and that they have complied with the administering VE requirements","sub":"E1E"},{"id":"E1F01","question":"On what frequencies are spread spectrum transmissions permitted?","answer":"Only on amateur frequencies above 222 MHz","sub":"E1F"},{"id":"E1F02","question":"What privileges are authorized in the US to persons holding an amateur service license granted by the government of Canada?","answer":"The operating terms and conditions of the Canadian amateur service license, not to exceed US Amateur Extra class license privileges","sub":"E1F"},{"id":"E1F03","question":"Under what circumstances may a dealer sell an external RF power amplifier capable of operation below 144 MHz if it has not been granted FCC certification?","answer":"The amplifier is constructed or modified by an amateur radio operator for use at an amateur station","sub":"E1F"},{"id":"E1F04","question":"Which of the following geographic descriptions approximately describes \"Line A\"?","answer":"A line roughly parallel to and south of the border between the US and Canada","sub":"E1F"},{"id":"E1F05","question":"Amateur stations may not transmit in which of the following frequency segments if they are located in the contiguous 48 states and north of Line A?","answer":"420 MHz - 430 MHz","sub":"E1F"},{"id":"E1F06","question":"Under what circumstances might the FCC issue a Special Temporary Authority (STA) to an amateur station?","answer":"To provide for experimental amateur communications","sub":"E1F"},{"id":"E1F07","question":"When may an amateur station send a message to a business?","answer":"When neither the amateur nor their employer has a pecuniary interest in the communications","sub":"E1F"},{"id":"E1F08","question":"Which of the following types of amateur station communications are prohibited?","answer":"Communications transmitted for hire or material compensation, except as otherwise provided in the rules","sub":"E1F"},{"id":"E1F09","question":"Which of the following cannot be transmitted over an amateur radio mesh network?","answer":"Messages encoded to obscure their meaning","sub":"E1F"},{"id":"E1F10","question":"Who may be the control operator of an auxiliary station?","answer":"Only Technician, General, Advanced, or Amateur Extra class operators","sub":"E1F"},{"id":"E1F11","question":"Which of the following best describes one of the standards that must be met by an external RF power amplifier if it is to qualify for a grant of FCC certification?","answer":"It must satisfy the FCC\u2019s spurious emission standards when operated at the lesser of 1500 watts or its full output power","sub":"E1F"},{"id":"E2A01","question":"What is the direction of an ascending pass for an amateur satellite?","answer":"From south to north","sub":"E2A"},{"id":"E2A02","question":"Which of the following is characteristic of an inverting linear transponder?","answer":"All these choices are correct","sub":"E2A"},{"id":"E2A03","question":"How is an upload signal processed by an inverting linear transponder?","answer":"The signal is mixed with a local oscillator signal and the difference product is transmitted","sub":"E2A"},{"id":"E2A04","question":"What is meant by the \u201cmode\u201d of an amateur radio satellite?","answer":"The satellite\u2019s uplink and downlink frequency bands","sub":"E2A"},{"id":"E2A05","question":"What do the letters in a satellite\u2019s mode designator specify?","answer":"The uplink and downlink frequency ranges","sub":"E2A"},{"id":"E2A06","question":"What are Keplerian elements?","answer":"Parameters that define the orbit of a satellite","sub":"E2A"},{"id":"E2A07","question":"Which of the following types of signals can be relayed through a linear transponder?","answer":"All these choices are correct","sub":"E2A"},{"id":"E2A08","question":"Why should effective radiated power (ERP) be limited to a satellite that uses a linear transponder?","answer":"To avoid reducing the downlink power to all other users","sub":"E2A"},{"id":"E2A09","question":"What do the terms \u201cL band\u201d and \u201cS band\u201d specify?","answer":"The 23- and 13-centimeter bands","sub":"E2A"},{"id":"E2A10","question":"What type of satellite appears to stay in one position in the sky?","answer":"Geostationary","sub":"E2A"},{"id":"E2A11","question":"What type of antenna can be used to minimize the effects of spin modulation and Faraday rotation?","answer":"A circularly polarized antenna","sub":"E2A"},{"id":"E2A12","question":"What is the purpose of digital store-and-forward functions on an amateur radio satellite?","answer":"To hold digital messages in the satellite for later download","sub":"E2A"},{"id":"E2B01","question":"In digital television, what does a coding rate of 3/4 mean?","answer":"25% of the data sent is forward error correction data","sub":"E2B"},{"id":"E2B02","question":"How many horizontal lines make up a fast-scan (NTSC) television frame?","answer":"525","sub":"E2B"},{"id":"E2B03","question":"How is an interlaced scanning pattern generated in a fast-scan (NTSC) television system?","answer":"By scanning odd-numbered lines in one field and even-numbered lines in the next","sub":"E2B"},{"id":"E2B04","question":"How is color information sent in analog SSTV?","answer":"Color lines are sent sequentially","sub":"E2B"},{"id":"E2B05","question":"Which of the following describes the use of vestigial sideband in analog fast-scan TV transmissions?","answer":"Vestigial sideband reduces the bandwidth while increasing the fidelity of low frequency video components","sub":"E2B"},{"id":"E2B06","question":"What is vestigial sideband modulation?","answer":"Amplitude modulation in which one complete sideband and a portion of the other are transmitted","sub":"E2B"},{"id":"E2B07","question":"Which types of modulation are used for amateur television DVB-T signals?","answer":"QAM and QPSK","sub":"E2B"},{"id":"E2B08","question":"What technique allows commercial analog TV receivers to be used for fast-scan TV operations on the 70-centimeter band?","answer":"Transmitting on channels shared with cable TV","sub":"E2B"},{"id":"E2B09","question":"What kind of receiver can be used to receive and decode SSTV using the Digital Radio Mondiale (DRM) protocol?","answer":"SSB","sub":"E2B"},{"id":"E2B10","question":"What aspect of an analog slow-scan television signal encodes the brightness of the picture?","answer":"Tone frequency","sub":"E2B"},{"id":"E2B11","question":"What is the function of the vertical interval signaling (VIS) code sent as part of an SSTV transmission?","answer":"To identify the SSTV mode being used","sub":"E2B"},{"id":"E2B12","question":"What signals SSTV receiving software to begin a new picture line?","answer":"Specific tone frequencies","sub":"E2B"},{"id":"E2C01","question":"What indicator is required to be used by US-licensed operators when operating a station via remote control and the remote transmitter is located in the US?","answer":"No additional indicator is required","sub":"E2C"},{"id":"E2C02","question":"Which of the following file formats is used for exchanging amateur radio log data?","answer":"ADIF","sub":"E2C"},{"id":"E2C03","question":"From which of the following bands is amateur radio contesting generally excluded?","answer":"30 meters","sub":"E2C"},{"id":"E2C04","question":"Which of the following frequencies can be used for amateur radio mesh networks?","answer":"Frequencies shared with various unlicensed wireless data services","sub":"E2C"},{"id":"E2C05","question":"What is the function of a DX QSL Manager?","answer":"Handle the receiving and sending of confirmations for a DX station","sub":"E2C"},{"id":"E2C06","question":"During a VHF/UHF contest, in which band segment would you expect to find the highest level of SSB or CW activity?","answer":"In the weak signal segment of the band, with most of the activity near the calling frequency","sub":"E2C"},{"id":"E2C07","question":"What is the Cabrillo format?","answer":"A standard for submission of electronic contest logs","sub":"E2C"},{"id":"E2C08","question":"Which of the following contacts may be confirmed through the Logbook of The World (LoTW)?","answer":"All these choices are correct","sub":"E2C"},{"id":"E2C09","question":"What type of equipment is commonly used to implement an amateur radio mesh network?","answer":"A wireless router running custom firmware","sub":"E2C"},{"id":"E2C10","question":"Why do DX stations often transmit and receive on different frequencies?","answer":"All these choices are correct","sub":"E2C"},{"id":"E2C11","question":"How should you generally identify your station when attempting to contact a DX station during a contest or in a pileup?","answer":"Send your full call sign once or twice","sub":"E2C"},{"id":"E2C12","question":"What indicates the delay between a control operator action and the corresponding change in the transmitted signal?","answer":"Latency","sub":"E2C"},{"id":"E2D01","question":"Which of the following digital modes is designed for meteor scatter communications?","answer":"MSK144","sub":"E2D"},{"id":"E2D02","question":"What information replaces signal-to-noise ratio when using the FT8 or FT4 modes in a VHF contest?","answer":"Grid square","sub":"E2D"},{"id":"E2D03","question":"Which of the following digital modes is designed for EME communications?","answer":"Q65","sub":"E2D"},{"id":"E2D04","question":"What technology is used for real-time tracking of balloons carrying amateur radio transmitters?","answer":"APRS","sub":"E2D"},{"id":"E2D05","question":"What is the characteristic of the JT65 mode?","answer":"Decodes signals with a very low signal-to-noise ratio","sub":"E2D"},{"id":"E2D06","question":"Which of the following is a method for establishing EME contacts?","answer":"Time-synchronous transmissions alternating between stations","sub":"E2D"},{"id":"E2D07","question":"What digital protocol is used by APRS?","answer":"AX.25","sub":"E2D"},{"id":"E2D08","question":"What type of packet frame is used to transmit APRS beacon data?","answer":"Unnumbered Information","sub":"E2D"},{"id":"E2D09","question":"What type of modulation is used by JT65?","answer":"Multitone AFSK","sub":"E2D"},{"id":"E2D10","question":"What does the packet path WIDE3-1 designate?","answer":"Three digipeater hops are requested with one remaining","sub":"E2D"},{"id":"E2D11","question":"How do APRS stations relay data?","answer":"By packet digipeaters","sub":"E2D"},{"id":"E2E01","question":"Which of the following types of modulation is used for data emissions below 30 MHz?","answer":"FSK","sub":"E2E"},{"id":"E2E02","question":"Which of the following synchronizes WSJT-X digital mode transmit/receive timing?","answer":"Synchronization of computer clocks","sub":"E2E"},{"id":"E2E03","question":"To what does the \"4\" in FT4 refer?","answer":"Four-tone continuous-phase frequency shift keying","sub":"E2E"},{"id":"E2E04","question":"Which of the following is characteristic of the FST4 mode?","answer":"All these choices are correct","sub":"E2E"},{"id":"E2E05","question":"Which of these digital modes does not support keyboard-to-keyboard operation?","answer":"WSPR","sub":"E2E"},{"id":"E2E06","question":"What is the length of an FT8 transmission cycle?","answer":"15 seconds","sub":"E2E"},{"id":"E2E07","question":"How does Q65 differ from JT65?","answer":"Multiple receive cycles are averaged","sub":"E2E"},{"id":"E2E08","question":"Which of the following HF digital modes can be used to transfer binary files?","answer":"PACTOR","sub":"E2E"},{"id":"E2E09","question":"Which of the following HF digital modes uses variable-length character coding?","answer":"PSK31","sub":"E2E"},{"id":"E2E10","question":"Which of these digital modes has the narrowest bandwidth?","answer":"FT8","sub":"E2E"},{"id":"E2E11","question":"What is the difference between direct FSK and audio FSK?","answer":"Direct FSK modulates the transmitter VFO","sub":"E2E"},{"id":"E2E12","question":"How do ALE stations establish contact?","answer":"ALE constantly scans a list of frequencies, activating the radio when the designated call sign is received","sub":"E2E"},{"id":"E2E13","question":"Which of these digital modes has the highest data throughput under clear communication conditions?","answer":"PACTOR IV","sub":"E2E"},{"id":"E3A01","question":"What is the approximate maximum separation measured along the surface of the Earth between two stations communicating by EME?","answer":"12,000 miles, if the moon is \u201cvisible\u201d by both stations","sub":"E3A"},{"id":"E3A02","question":"What characterizes libration fading of an EME signal?","answer":"A fluttery, irregular fading","sub":"E3A"},{"id":"E3A03","question":"When scheduling EME contacts, which of these conditions will generally result in the least path loss?","answer":"When the Moon is at perigee","sub":"E3A"},{"id":"E3A04","question":"In what direction does an electromagnetic wave travel?","answer":"It travels at a right angle to the electric and magnetic fields","sub":"E3A"},{"id":"E3A05","question":"How are the component fields of an electromagnetic wave oriented?","answer":"They are at right angles","sub":"E3A"},{"id":"E3A06","question":"What should be done to continue a long-distance contact when the MUF for that path decreases due to darkness?","answer":"Switch to a lower frequency HF band","sub":"E3A"},{"id":"E3A07","question":"Atmospheric ducts capable of propagating microwave signals often form over what geographic feature?","answer":"Large bodies of water","sub":"E3A"},{"id":"E3A08","question":"When a meteor strikes the Earth\u2019s atmosphere, a linear ionized region is formed at what region of the ionosphere?","answer":"The E region","sub":"E3A"},{"id":"E3A09","question":"Which of the following frequency ranges is most suited for meteor-scatter communications?","answer":"28 MHz - 148 MHz","sub":"E3A"},{"id":"E3A10","question":"What determines the speed of electromagnetic waves through a medium?","answer":"The index of refraction","sub":"E3A"},{"id":"E3A11","question":"What is a typical range for tropospheric duct propagation of microwave signals?","answer":"100 miles to 300 miles","sub":"E3A"},{"id":"E3A12","question":"What is most likely to result in auroral propagation?","answer":"Severe geomagnetic storms","sub":"E3A"},{"id":"E3A13","question":"Which of these emission modes is best for auroral propagation?","answer":"CW","sub":"E3A"},{"id":"E3A14","question":"What are circularly polarized electromagnetic waves?","answer":"Waves with rotating electric and magnetic fields","sub":"E3A"},{"id":"E3B01","question":"Where is transequatorial propagation (TEP) most likely to occur?","answer":"Between points separated by 2,000 miles to 3,000 miles over a path perpendicular to the geomagnetic equator","sub":"E3B"},{"id":"E3B02","question":"What is the approximate maximum range for signals using transequatorial propagation?","answer":"5,000 miles","sub":"E3B"},{"id":"E3B03","question":"At what time of day is transequatorial propagation most likely to occur?","answer":"Afternoon or early evening","sub":"E3B"},{"id":"E3B04","question":"What are \u201cextraordinary\u201d and \u201cordinary\u201d waves?","answer":"Independently propagating, elliptically polarized waves created in the ionosphere","sub":"E3B"},{"id":"E3B05","question":"Which of the following paths is most likely to support long-distance propagation on 160 meters?","answer":"A path entirely in darkness","sub":"E3B"},{"id":"E3B06","question":"On which of the following amateur bands is long-path propagation most frequent?","answer":"40 meters and 20 meters","sub":"E3B"},{"id":"E3B07","question":"What effect does lowering a signal\u2019s transmitted elevation angle have on ionospheric HF skip propagation?","answer":"The distance covered by each hop increases","sub":"E3B"},{"id":"E3B08","question":"How does the maximum range of ground-wave propagation change when the signal frequency is increased?","answer":"It decreases","sub":"E3B"},{"id":"E3B09","question":"At what time of year is sporadic-E propagation most likely to occur?","answer":"Around the solstices, especially the summer solstice","sub":"E3B"},{"id":"E3B10","question":"What is the effect of chordal-hop propagation?","answer":"The signal experiences less loss compared to multi-hop propagation, which uses Earth as a reflector","sub":"E3B"},{"id":"E3B11","question":"At what time of day is sporadic-E propagation most likely to occur?","answer":"Between sunrise and sunset","sub":"E3B"},{"id":"E3B12","question":"What is chordal-hop propagation?","answer":"Successive ionospheric refractions without an intermediate reflection from the ground","sub":"E3B"},{"id":"E3B13","question":"What type of polarization is supported by ground-wave propagation?","answer":"Vertical","sub":"E3B"},{"id":"E3C01","question":"What is the cause of short-term radio blackouts?","answer":"Solar flares","sub":"E3C"},{"id":"E3C02","question":"What is indicated by a rising A-index or K-index?","answer":"Increasing disturbance of the geomagnetic field","sub":"E3C"},{"id":"E3C03","question":"Which of the following signal paths is most likely to experience high levels of absorption when the A-index or K-index is elevated?","answer":"Through the auroral oval","sub":"E3C"},{"id":"E3C04","question":"What does the value of Bz (B sub z) represent?","answer":"North-south strength of the interplanetary magnetic field","sub":"E3C"},{"id":"E3C05","question":"What orientation of Bz (B sub z) increases the likelihood that charged particles from the Sun will cause disturbed conditions?","answer":"Southward","sub":"E3C"},{"id":"E3C06","question":"How does the VHF/UHF radio horizon compare to the geographic horizon?","answer":"It is approximately 15 percent farther","sub":"E3C"},{"id":"E3C07","question":"Which of the following indicates the greatest solar flare intensity?","answer":"Class X","sub":"E3C"},{"id":"E3C08","question":"Which of the following is the space-weather term for an extreme geomagnetic storm?","answer":"G5","sub":"E3C"},{"id":"E3C09","question":"What type of data is reported by amateur radio propagation reporting networks?","answer":"Digital-mode and CW signals","sub":"E3C"},{"id":"E3C10","question":"What does the 304A solar parameter measure?","answer":"UV emissions at 304 angstroms, correlated to the solar flux index","sub":"E3C"},{"id":"E3C11","question":"What does VOACAP software model?","answer":"HF propagation","sub":"E3C"},{"id":"E3C12","question":"Which of the following is indicated by a sudden rise in radio background noise across a large portion of the HF spectrum?","answer":"A coronal mass ejection impact or a solar flare has occurred","sub":"E3C"},{"id":"E4A01","question":"Which of the following limits the highest frequency signal that can be accurately displayed on a digital oscilloscope?","answer":"Sampling rate of the analog-to-digital converter","sub":"E4A"},{"id":"E4A02","question":"Which of the following parameters does a spectrum analyzer display on the vertical and horizontal axes?","answer":"Signal amplitude and frequency","sub":"E4A"},{"id":"E4A03","question":"Which of the following test instruments is used to display spurious signals and/or intermodulation distortion products generated by an SSB transmitter?","answer":"Spectrum analyzer","sub":"E4A"},{"id":"E4A04","question":"How is compensation of an oscilloscope probe performed?","answer":"A square wave is displayed, and the probe is adjusted until the horizontal portions of the displayed wave are as nearly flat as possible","sub":"E4A"},{"id":"E4A05","question":"What is the purpose of using a prescaler with a frequency counter?","answer":"Reduce the signal frequency to within the counter's operating range","sub":"E4A"},{"id":"E4A06","question":"What is the effect of aliasing on a digital oscilloscope when displaying a waveform?","answer":"A false, jittery low-frequency version of the waveform is displayed","sub":"E4A"},{"id":"E4A07","question":"Which of the following is an advantage of using an antenna analyzer compared to an SWR bridge?","answer":"Antenna analyzers compute SWR and impedance automatically","sub":"E4A"},{"id":"E4A08","question":"Which of the following is used to measure SWR?","answer":"All these choices are correct","sub":"E4A"},{"id":"E4A09","question":"Which of the following is good practice when using an oscilloscope probe?","answer":"Minimize the length of the probe's ground connection","sub":"E4A"},{"id":"E4A10","question":"Which trigger mode is most effective when using an oscilloscope to measure a linear power supply\u2019s output ripple?","answer":"Line","sub":"E4A"},{"id":"E4A11","question":"Which of the following can be measured with an antenna analyzer?","answer":"All these choices are correct","sub":"E4A"},{"id":"E4B01","question":"Which of the following factors most affects the accuracy of a frequency counter?","answer":"Time base accuracy","sub":"E4B"},{"id":"E4B02","question":"What is the significance of voltmeter sensitivity expressed in ohms per volt?","answer":"The full scale reading of the voltmeter multiplied by its ohms per volt rating is the input impedance of the voltmeter","sub":"E4B"},{"id":"E4B03","question":"Which S parameter is equivalent to forward gain?","answer":"S21","sub":"E4B"},{"id":"E4B04","question":"Which S parameter represents input port return loss or reflection coefficient (equivalent to VSWR)?","answer":"S11","sub":"E4B"},{"id":"E4B05","question":"What three test loads are used to calibrate an RF vector network analyzer?","answer":"Short circuit, open circuit, and 50 ohms","sub":"E4B"},{"id":"E4B06","question":"How much power is being absorbed by the load when a directional power meter connected between a transmitter and a terminating load reads 100 watts forward power and 25 watts reflected power?","answer":"75 watts","sub":"E4B"},{"id":"E4B07","question":"What do the subscripts of S parameters represent?","answer":"The port or ports at which measurements are made","sub":"E4B"},{"id":"E4B08","question":"Which of the following can be used to determine the Q of a series-tuned circuit?","answer":"The bandwidth of the circuit's frequency response","sub":"E4B"},{"id":"E4B09","question":"Which of the following can be measured by a two-port vector network analyzer?","answer":"Filter frequency response","sub":"E4B"},{"id":"E4B10","question":"Which of the following methods measures intermodulation distortion in an SSB transmitter?","answer":"Modulate the transmitter using two AF signals having non-harmonically related frequencies and observe the RF output with a spectrum analyzer","sub":"E4B"},{"id":"E4B11","question":"Which of the following can be measured with a vector network analyzer?","answer":"All these choices are correct","sub":"E4B"},{"id":"E4C01","question":"What is an effect of excessive phase noise in an SDR receiver\u2019s master clock oscillator?","answer":"It can combine with strong signals on nearby frequencies to generate interference","sub":"E4C"},{"id":"E4C02","question":"Which of the following receiver circuits can be effective in eliminating interference from strong out-of-band signals?","answer":"A front-end filter or preselector","sub":"E4C"},{"id":"E4C03","question":"What is the term for the suppression in an FM receiver of one signal by another stronger signal on the same frequency?","answer":"Capture effect","sub":"E4C"},{"id":"E4C04","question":"What is the noise figure of a receiver?","answer":"The ratio in dB of the noise generated by the receiver to the theoretical minimum noise","sub":"E4C"},{"id":"E4C05","question":"What does a receiver noise floor of -174 dBm represent?","answer":"The theoretical noise in a 1 Hz bandwidth at the input of a perfect receiver at room temperature","sub":"E4C"},{"id":"E4C06","question":"How much does increasing a receiver\u2019s bandwidth from 50 Hz to 1,000 Hz increase the receiver\u2019s noise floor?","answer":"13 dB","sub":"E4C"},{"id":"E4C07","question":"What does the MDS of a receiver represent?","answer":"The minimum discernible signal","sub":"E4C"},{"id":"E4C08","question":"An SDR receiver is overloaded when input signals exceed what level?","answer":"The reference voltage of the analog-to-digital converter","sub":"E4C"},{"id":"E4C09","question":"Which of the following choices is a good reason for selecting a high IF for a superheterodyne HF or VHF communications receiver?","answer":"Easier for front-end circuitry to eliminate image responses","sub":"E4C"},{"id":"E4C10","question":"What is an advantage of having a variety of receiver bandwidths from which to select?","answer":"Receive bandwidth can be set to match the modulation bandwidth, maximizing signal-to-noise ratio and minimizing interference","sub":"E4C"},{"id":"E4C11","question":"Why does input attenuation reduce receiver overload on the lower frequency HF bands with little or no impact on signal-to-noise ratio?","answer":"Atmospheric noise is generally greater than internally generated noise even after attenuation","sub":"E4C"},{"id":"E4C12","question":"How does a narrow-band roofing filter affect receiver performance?","answer":"It improves blocking dynamic range by attenuating strong signals near the receive frequency","sub":"E4C"},{"id":"E4C13","question":"What is reciprocal mixing?","answer":"Local oscillator phase noise mixing with adjacent strong signals to create interference to desired signals","sub":"E4C"},{"id":"E4C14","question":"What is the purpose of the receiver IF Shift control?","answer":"To reduce interference from stations transmitting on adjacent frequencies","sub":"E4C"},{"id":"E4D01","question":"What is meant by the blocking dynamic range of a receiver?","answer":"The difference in dB between the noise floor and the level of an incoming signal that will cause 1 dB of gain compression","sub":"E4D"},{"id":"E4D02","question":"Which of the following describes problems caused by poor dynamic range in a receiver?","answer":"Spurious signals caused by cross modulation and desensitization from strong adjacent signals","sub":"E4D"},{"id":"E4D03","question":"What creates intermodulation interference between two repeaters in close proximity?","answer":"The output signals mix in the final amplifier of one or both transmitters","sub":"E4D"},{"id":"E4D04","question":"Which of the following is used to reduce or eliminate intermodulation interference in a repeater caused by a nearby transmitter?","answer":"A properly terminated circulator at the output of the repeater\u2019s transmitter","sub":"E4D"},{"id":"E4D06","question":"What is the term for the reduction in receiver sensitivity caused by a strong signal near the received frequency?","answer":"Desensitization","sub":"E4D"},{"id":"E4D07","question":"Which of the following reduces the likelihood of receiver desensitization?","answer":"Insert attenuation before the first RF stage","sub":"E4D"},{"id":"E4D08","question":"What causes intermodulation in an electronic circuit?","answer":"Nonlinear circuits or devices","sub":"E4D"},{"id":"E4D09","question":"What is the purpose of the preselector in a communications receiver?","answer":"To increase the rejection of signals outside the band being received","sub":"E4D"},{"id":"E4D10","question":"What does a third-order intercept level of 40 dBm mean with respect to receiver performance?","answer":"A pair of 40 dBm input signals will theoretically generate a third-order intermodulation product that has the same output amplitude as either of the input signals","sub":"E4D"},{"id":"E4D11","question":"Why are odd-order intermodulation products, created within a receiver, of particular interest compared to other products?","answer":"Odd-order products of two signals in the band being received are also likely to be within the band","sub":"E4D"},{"id":"E4D12","question":"What is the link margin in a system with a transmit power level of 10 W (+40 dBm), a system antenna gain of 10 dBi, a cable loss of 3 dB, a path loss of 136 dB, a receiver minimum discernable signal of -103 dBm, and a required signal-to-noise ratio of 6 dB?","answer":"+8dB","sub":"E4D"},{"id":"E4D13","question":"What is the received signal level with a transmit power of 10 W (+40 dBm), a transmit antenna gain of 6 dBi, a receive antenna gain of 3 dBi, and a path loss of 100 dB?","answer":"-51 dBm","sub":"E4D"},{"id":"E4D14","question":"What power level does a receiver minimum discernible signal of -100 dBm represent?","answer":"0.1 picowatts","sub":"E4D"},{"id":"E4E01","question":"What problem can occur when using an automatic notch filter (ANF) to remove interfering carriers while receiving CW signals?","answer":"Removal of the CW signal as well as the interfering carrier","sub":"E4E"},{"id":"E4E02","question":"Which of the following types of noise can often be reduced by a digital noise reduction?","answer":"All these choices are correct","sub":"E4E"},{"id":"E4E03","question":"Which of the following types of noise are removed by a noise blanker?","answer":"Impulse noise","sub":"E4E"},{"id":"E4E04","question":"How can conducted noise from an automobile battery charging system be suppressed?","answer":"By installing ferrite chokes on the charging system leads","sub":"E4E"},{"id":"E4E05","question":"What is used to suppress radio frequency interference from a line-driven AC motor?","answer":"A brute-force AC-line filter in series with the motor\u2019s power leads","sub":"E4E"},{"id":"E4E06","question":"What type of electrical interference can be caused by computer network equipment?","answer":"The appearance of unstable modulated or unmodulated signals at specific frequencies","sub":"E4E"},{"id":"E4E07","question":"Which of the following can cause shielded cables to radiate or receive interference?","answer":"Common-mode currents on the shield and conductors","sub":"E4E"},{"id":"E4E08","question":"What current flows equally on all conductors of an unshielded multiconductor cable?","answer":"Common-mode current","sub":"E4E"},{"id":"E4E09","question":"What undesirable effect can occur when using a noise blanker?","answer":"Strong signals may be distorted and appear to cause spurious emissions","sub":"E4E"},{"id":"E4E10","question":"Which of the following can create intermittent loud roaring or buzzing AC line interference?","answer":"All these choices are correct","sub":"E4E"},{"id":"E4E11","question":"What could be the cause of local AM broadcast band signals combining to generate spurious signals on the MF or HF bands?","answer":"Nearby corroded metal connections are mixing and reradiating the broadcast signals","sub":"E4E"},{"id":"E4E12","question":"What causes interference received as a series of carriers at regular intervals across a wide frequency range?","answer":"Switch-mode power supplies","sub":"E4E"},{"id":"E4E13","question":"Where should a station AC surge protector be installed?","answer":"On the single point ground panel","sub":"E4E"},{"id":"E4E14","question":"What is the purpose of a single point ground panel?","answer":"Ensure all lightning protectors activate at the same time","sub":"E4E"},{"id":"E5A01","question":"What can cause the voltage across reactances in a series RLC circuit to be higher than the voltage applied to the entire circuit?","answer":"Resonance","sub":"E5A"},{"id":"E5A02","question":"What is the resonant frequency of an RLC circuit if R is 22 ohms, L is 50 microhenries, and C is 40 picofarads?","answer":"3.56 MHz","sub":"E5A"},{"id":"E5A03","question":"What is the magnitude of the impedance of a series RLC circuit at resonance?","answer":"Approximately equal to circuit resistance","sub":"E5A"},{"id":"E5A04","question":"What is the magnitude of the impedance of a parallel RLC circuit at resonance?","answer":"Approximately equal to circuit resistance","sub":"E5A"},{"id":"E5A05","question":"What is the result of increasing the Q of an impedance-matching circuit?","answer":"Matching bandwidth is decreased","sub":"E5A"},{"id":"E5A06","question":"What is the magnitude of the circulating current within the components of a parallel LC circuit at resonance?","answer":"It is at a maximum","sub":"E5A"},{"id":"E5A07","question":"What is the magnitude of the current at the input of a parallel RLC circuit at resonance?","answer":"Minimum","sub":"E5A"},{"id":"E5A08","question":"What is the phase relationship between the current through and the voltage across a series resonant circuit at resonance?","answer":"The voltage and current are in phase","sub":"E5A"},{"id":"E5A09","question":"How is the Q of an RLC parallel resonant circuit calculated?","answer":"Resistance divided by the reactance of either the inductance or capacitance","sub":"E5A"},{"id":"E5A10","question":"What is the resonant frequency of an RLC circuit if R is 33 ohms, L is 50 microhenries, and C is 10 picofarads?","answer":"7.12 MHz","sub":"E5A"},{"id":"E5A11","question":"What is the half-power bandwidth of a resonant circuit that has a resonant frequency of 7.1 MHz and a Q of 150?","answer":"47.3 kHz","sub":"E5A"},{"id":"E5A12","question":"What is the half-power bandwidth of a resonant circuit that has a resonant frequency of 3.7 MHz and a Q of 118?","answer":"31.4 kHz","sub":"E5A"},{"id":"E5A13","question":"What is an effect of increasing Q in a series resonant circuit?","answer":"Internal voltages increase","sub":"E5A"},{"id":"E5B01","question":"What is the term for the time required for the capacitor in an RC circuit to be charged to 63.2% of the applied voltage or to discharge to 36.8% of its initial voltage?","answer":"One time constant","sub":"E5B"},{"id":"E5B02","question":"What letter is commonly used to represent susceptance?","answer":"B","sub":"E5B"},{"id":"E5B03","question":"How is impedance in polar form converted to an equivalent admittance?","answer":"Take the reciprocal of the magnitude and change the sign of the angle","sub":"E5B"},{"id":"E5B04","question":"What is the time constant of a circuit having two 220-microfarad capacitors and two 1-megohm resistors, all in parallel?","answer":"220 seconds","sub":"E5B"},{"id":"E5B05","question":"What is the effect on the magnitude of pure reactance when it is converted to susceptance?","answer":"It is replaced by its reciprocal","sub":"E5B"},{"id":"E5B06","question":"What is susceptance?","answer":"The imaginary part of admittance","sub":"E5B"},{"id":"E5B07","question":"What is the phase angle between the voltage across and the current through a series RLC circuit if XC is 500 ohms, R is 1 kilohm, and XL is 250 ohms?","answer":"14.0 degrees with the voltage lagging the current","sub":"E5B"},{"id":"E5B08","question":"What is the phase angle between the voltage across and the current through a series RLC circuit if XC is 300 ohms, R is 100 ohms, and XL is 100 ohms?","answer":"63 degrees with the voltage lagging the current","sub":"E5B"},{"id":"E5B09","question":"What is the relationship between the AC current through a capacitor and the voltage across a capacitor?","answer":"Current leads voltage by 90 degrees","sub":"E5B"},{"id":"E5B10","question":"What is the relationship between the AC current through an inductor and the voltage across an inductor?","answer":"Voltage leads current by 90 degrees","sub":"E5B"},{"id":"E5B11","question":"What is the phase angle between the voltage across and the current through a series RLC circuit if XC is 25 ohms, R is 100 ohms, and XL is 75 ohms?","answer":"27 degrees with the voltage leading the current","sub":"E5B"},{"id":"E5B12","question":"What is admittance?","answer":"The inverse of impedance","sub":"E5B"},{"id":"E5C01","question":"Which of the following represents pure capacitive reactance of 100 ohms in rectangular notation?","answer":"0 - j100","sub":"E5C"},{"id":"E5C02","question":"How are impedances described in polar coordinates?","answer":"By magnitude and phase angle","sub":"E5C"},{"id":"E5C03","question":"Which of the following represents a pure inductive reactance in polar coordinates?","answer":"A positive 90 degree phase angle","sub":"E5C"},{"id":"E5C04","question":"What type of Y-axis scale is most often used for graphs of circuit frequency response?","answer":"Logarithmic","sub":"E5C"},{"id":"E5C05","question":"What kind of diagram is used to show the phase relationship between impedances at a given frequency?","answer":"Phasor diagram","sub":"E5C"},{"id":"E5C06","question":"What does the impedance 50 - j25 ohms represent?","answer":"50 ohms resistance in series with 25 ohms capacitive reactance","sub":"E5C"},{"id":"E5C07","question":"Where is the impedance of a pure resistance plotted on rectangular coordinates?","answer":"On the horizontal axis","sub":"E5C"},{"id":"E5C08","question":"What coordinate system is often used to display the phase angle of a circuit containing resistance, inductive, and/or capacitive reactance?","answer":"Polar coordinates","sub":"E5C"},{"id":"E5C09","question":"When using rectangular coordinates to graph the impedance of a circuit, what do the axes represent?","answer":"The X axis represents the resistive component, and the Y axis represents the reactive component","sub":"E5C"},{"id":"E5C10","question":"Which point on Figure E5-1 best represents the impedance of a series circuit consisting of a 400-ohm resistor and a 38-picofarad capacitor at 14 MHz?","answer":"Point 4","sub":"E5C"},{"id":"E5C11","question":"Which point in Figure E5-1 best represents the impedance of a series circuit consisting of a 300-ohm resistor and an 18-microhenry inductor at 3.505 MHz?","answer":"Point 3","sub":"E5C"},{"id":"E5C12","question":"Which point on Figure E5-1 best represents the impedance of a series circuit consisting of a 300-ohm resistor and a 19-picofarad capacitor at 21.200 MHz?","answer":"Point 1","sub":"E5C"},{"id":"E5D01","question":"What is the result of conductor skin effect?","answer":"Resistance increases as frequency increases because RF current flows closer to the surface","sub":"E5D"},{"id":"E5D02","question":"Why is it important to keep lead lengths short for components used in circuits for VHF and above?","answer":"To minimize inductive reactance","sub":"E5D"},{"id":"E5D03","question":"What is the phase relationship between current and voltage for reactive power?","answer":"They are 90 degrees out of phase","sub":"E5D"},{"id":"E5D04","question":"Why are short connections used at microwave frequencies?","answer":"To reduce phase shift along the connection","sub":"E5D"},{"id":"E5D05","question":"What parasitic characteristic causes electrolytic capacitors to be unsuitable for use at RF?","answer":"Inductance","sub":"E5D"},{"id":"E5D06","question":"What parasitic characteristic creates an inductor\u2019s self-resonance?","answer":"Inter-turn capacitance","sub":"E5D"},{"id":"E5D07","question":"What combines to create the self-resonance of a component?","answer":"The component\u2019s nominal and parasitic reactance","sub":"E5D"},{"id":"E5D08","question":"What is the primary cause of loss in film capacitors at RF?","answer":"Skin effect","sub":"E5D"},{"id":"E5D09","question":"What happens to reactive power in ideal inductors and capacitors?","answer":"Energy is stored in magnetic or electric fields, but power is not dissipated","sub":"E5D"},{"id":"E5D10","question":"As a conductor\u2019s diameter increases, what is the effect on its electrical length?","answer":"It increases","sub":"E5D"},{"id":"E5D11","question":"How much real power is consumed in a circuit consisting of a 100-ohm resistor in series with a 100-ohm inductive reactance drawing 1 ampere?","answer":"100 watts","sub":"E5D"},{"id":"E5D12","question":"What is reactive power?","answer":"Wattless, nonproductive power","sub":"E5D"},{"id":"E6A01","question":"In what application is gallium arsenide used as a semiconductor material?","answer":"In microwave circuits","sub":"E6A"},{"id":"E6A02","question":"Which of the following semiconductor materials contains excess free electrons?","answer":"N-type","sub":"E6A"},{"id":"E6A03","question":"Why does a PN-junction diode not conduct current when reverse biased?","answer":"Holes in P-type material and electrons in the N-type material are separated by the applied voltage, widening the depletion region","sub":"E6A"},{"id":"E6A04","question":"What is the name given to an impurity atom that adds holes to a semiconductor crystal structure?","answer":"Acceptor impurity","sub":"E6A"},{"id":"E6A05","question":"How does DC input impedance at the gate of a field-effect transistor (FET) compare with that of a bipolar transistor?","answer":"An FET has higher input impedance","sub":"E6A"},{"id":"E6A06","question":"What is the beta of a bipolar junction transistor?","answer":"The change in collector current with respect to the change in base current","sub":"E6A"},{"id":"E6A07","question":"Which of the following indicates that a silicon NPN junction transistor is biased on?","answer":"Base-to-emitter voltage of approximately 0.6 volts to 0.7 volts","sub":"E6A"},{"id":"E6A08","question":"What is the term for the frequency at which the grounded-base current gain of a bipolar junction transistor has decreased to 0.7 of the gain obtainable at 1 kHz?","answer":"Alpha cutoff frequency","sub":"E6A"},{"id":"E6A09","question":"What is a depletion-mode field-effect transistor (FET)?","answer":"An FET that exhibits a current flow between source and drain when no gate voltage is applied","sub":"E6A"},{"id":"E6A10","question":"In Figure E6-1, which is the schematic symbol for an N-channel dual-gate MOSFET?","answer":"4","sub":"E6A"},{"id":"E6A11","question":"In Figure E6-1, which is the schematic symbol for a P-channel junction FET?","answer":"1","sub":"E6A"},{"id":"E6A12","question":"What is the purpose of connecting Zener diodes between a MOSFET gate and its source or drain?","answer":"To protect the gate from static damage","sub":"E6A"},{"id":"E6B01","question":"What is the most useful characteristic of a Zener diode?","answer":"A constant voltage drop under conditions of varying current","sub":"E6B"},{"id":"E6B02","question":"Which characteristic of a Schottky diode makes it a better choice than a silicon junction diode for use as a power supply rectifier?","answer":"Lower forward voltage drop","sub":"E6B"},{"id":"E6B03","question":"What property of an LED's semiconductor material determines its forward voltage drop?","answer":"Band gap","sub":"E6B"},{"id":"E6B04","question":"What type of semiconductor device is designed for use as a voltage-controlled capacitor?","answer":"Varactor diode","sub":"E6B"},{"id":"E6B05","question":"What characteristic of a PIN diode makes it useful as an RF switch?","answer":"Low junction capacitance","sub":"E6B"},{"id":"E6B06","question":"Which of the following is a common use of a Schottky diode?","answer":"As a VHF/UHF mixer or detector","sub":"E6B"},{"id":"E6B07","question":"What causes a junction diode to fail from excessive current?","answer":"Excessive junction temperature","sub":"E6B"},{"id":"E6B08","question":"Which of the following is a Schottky barrier diode?","answer":"Metal-semiconductor junction","sub":"E6B"},{"id":"E6B09","question":"What is a common use for point-contact diodes?","answer":"As an RF detector","sub":"E6B"},{"id":"E6B10","question":"In Figure E6-2, which is the schematic symbol for a Schottky diode?","answer":"6","sub":"E6B"},{"id":"E6B11","question":"What is used to control the attenuation of RF signals by a PIN diode?","answer":"Forward DC bias current","sub":"E6B"},{"id":"E6C01","question":"What is the function of hysteresis in a comparator?","answer":"To prevent input noise from causing unstable output signals","sub":"E6C"},{"id":"E6C02","question":"What happens when the level of a comparator\u2019s input signal crosses the threshold voltage?","answer":"The comparator changes its output state","sub":"E6C"},{"id":"E6C03","question":"What is tri-state logic?","answer":"Logic devices with 0, 1, and high-impedance output states","sub":"E6C"},{"id":"E6C04","question":"Which of the following is an advantage of BiCMOS logic?","answer":"It has the high input impedance of CMOS and the low output impedance of bipolar transistors","sub":"E6C"},{"id":"E6C05","question":"Which of the following digital logic families has the lowest power consumption?","answer":"CMOS","sub":"E6C"},{"id":"E6C06","question":"Why do CMOS digital integrated circuits have high immunity to noise on the input signal or power supply?","answer":"The input switching threshold is about half the power supply voltage","sub":"E6C"},{"id":"E6C07","question":"What best describes a pull-up or pull-down resistor?","answer":"A resistor connected to the positive or negative supply used to establish a voltage when an input or output is an open circuit","sub":"E6C"},{"id":"E6C08","question":"In Figure E6-3, which is the schematic symbol for a NAND gate?","answer":"2","sub":"E6C"},{"id":"E6C09","question":"What is used to design the configuration of a field-programmable gate array (FPGA)?","answer":"Hardware description language (HDL)","sub":"E6C"},{"id":"E6C10","question":"In Figure E6-3, which is the schematic symbol for a NOR gate?","answer":"4","sub":"E6C"},{"id":"E6C11","question":"In Figure E6-3, which is the schematic symbol for the NOT operation (inversion)?","answer":"5","sub":"E6C"},{"id":"E6D01","question":"What is piezoelectricity?","answer":"A characteristic of materials that generate a voltage when stressed and that flex when a voltage is applied","sub":"E6D"},{"id":"E6D02","question":"What is the equivalent circuit of a quartz crystal?","answer":"Series RLC in parallel with a shunt C representing electrode and stray capacitance","sub":"E6D"},{"id":"E6D03","question":"Which of the following is an aspect of the piezoelectric effect?","answer":"Mechanical deformation of material due to the application of a voltage","sub":"E6D"},{"id":"E6D04","question":"Why are cores of inductors and transformers sometimes constructed of thin layers?","answer":"To reduce power loss from eddy currents in the core","sub":"E6D"},{"id":"E6D05","question":"How do ferrite and powdered iron compare for use in an inductor core?","answer":"Ferrite cores generally require fewer turns to produce a given inductance value","sub":"E6D"},{"id":"E6D06","question":"What core material property determines the inductance of an inductor?","answer":"Permeability","sub":"E6D"},{"id":"E6D08","question":"Which of the following materials has the highest temperature stability of its magnetic characteristics?","answer":"Powdered iron","sub":"E6D"},{"id":"E6D09","question":"What devices are commonly used as VHF and UHF parasitic suppressors at the input and output terminals of a transistor HF amplifier?","answer":"Ferrite beads","sub":"E6D"},{"id":"E6D10","question":"What is a primary advantage of using a toroidal core instead of a solenoidal core in an inductor?","answer":"Toroidal cores confine most of the magnetic field within the core material","sub":"E6D"},{"id":"E6D11","question":"Which type of core material decreases inductance when inserted into a coil?","answer":"Brass","sub":"E6D"},{"id":"E6D12","question":"What causes inductor saturation?","answer":"Operation at excessive magnetic flux","sub":"E6D"},{"id":"E6E01","question":"Why is gallium arsenide (GaAs) useful for semiconductor devices operating at UHF and higher frequencies?","answer":"Higher electron mobility","sub":"E6E"},{"id":"E6E02","question":"Which of the following device packages is a through-hole type?","answer":"DIP","sub":"E6E"},{"id":"E6E03","question":"Which of the following materials supports the highest frequency of operation when used in MMICs?","answer":"Gallium nitride","sub":"E6E"},{"id":"E6E04","question":"Which is the most common input and output impedance of MMICs?","answer":"50 ohms","sub":"E6E"},{"id":"E6E05","question":"Which of the following noise figure values is typical of a low-noise UHF preamplifier?","answer":"0.5 dB","sub":"E6E"},{"id":"E6E06","question":"What characteristics of MMICs make them a popular choice for VHF through microwave circuits?","answer":"Controlled gain, low noise figure, and constant input and output impedance over the specified frequency range","sub":"E6E"},{"id":"E6E07","question":"What type of transmission line is often used for connections to MMICs?","answer":"Microstrip","sub":"E6E"},{"id":"E6E08","question":"How is power supplied to the most common type of MMIC?","answer":"Through a resistor and/or RF choke connected to the amplifier output lead","sub":"E6E"},{"id":"E6E09","question":"Which of the following component package types have the least parasitic effects at frequencies above the HF range?","answer":"Surface mount","sub":"E6E"},{"id":"E6E10","question":"What advantage does surface-mount technology offer at RF compared to using through-hole components?","answer":"All these choices are correct","sub":"E6E"},{"id":"E6E11","question":"What is a characteristic of DIP packaging used for integrated circuits?","answer":"Two rows of connecting pins on opposite sides of package (dual in-line package)","sub":"E6E"},{"id":"E6E12","question":"Why are DIP through-hole package ICs not typically used at UHF and higher frequencies?","answer":"Excessive lead length","sub":"E6E"},{"id":"E6F01","question":"What absorbs the energy from light falling on a photovoltaic cell?","answer":"Electrons","sub":"E6F"},{"id":"E6F02","question":"What happens to photoconductive material when light shines on it?","answer":"Resistance decreases","sub":"E6F"},{"id":"E6F03","question":"What is the most common configuration of an optoisolator or optocoupler?","answer":"An LED and a phototransistor","sub":"E6F"},{"id":"E6F04","question":"What is the photovoltaic effect?","answer":"The conversion of light to electrical energy","sub":"E6F"},{"id":"E6F05","question":"Which of the following describes an optical shaft encoder?","answer":"A device that detects rotation by interrupting a light source with a patterned wheel","sub":"E6F"},{"id":"E6F06","question":"Which of these materials is most commonly used to create photoconductive devices?","answer":"Crystalline semiconductor","sub":"E6F"},{"id":"E6F07","question":"What is a solid-state relay?","answer":"A device that uses semiconductors to implement the functions of an electromechanical relay","sub":"E6F"},{"id":"E6F08","question":"Why are optoisolators often used in conjunction with solid-state circuits that control 120 VAC circuits?","answer":"Optoisolators provide an electrical isolation between a control circuit and the circuit being switched","sub":"E6F"},{"id":"E6F09","question":"What is the efficiency of a photovoltaic cell?","answer":"The relative fraction of light that is converted to current","sub":"E6F"},{"id":"E6F10","question":"What is the most common material used in power-generating photovoltaic cells?","answer":"Silicon","sub":"E6F"},{"id":"E6F11","question":"What is the approximate open-circuit voltage produced by a fully illuminated silicon photovoltaic cell?","answer":"0.5 volts","sub":"E6F"},{"id":"E7A01","question":"Which circuit is bistable?","answer":"A flip-flop","sub":"E7A"},{"id":"E7A02","question":"What is the function of a decade counter?","answer":"It produces one output pulse for every 10 input pulses","sub":"E7A"},{"id":"E7A03","question":"Which of the following can divide the frequency of a pulse train by 2?","answer":"A flip-flop","sub":"E7A"},{"id":"E7A04","question":"How many flip-flops are required to divide a signal frequency by 16?","answer":"4","sub":"E7A"},{"id":"E7A05","question":"Which of the following circuits continuously alternates between two states without an external clock signal?","answer":"Astable multivibrator","sub":"E7A"},{"id":"E7A06","question":"What is a characteristic of a monostable multivibrator?","answer":"It switches temporarily to an alternate state for a set time","sub":"E7A"},{"id":"E7A07","question":"What logical operation does a NAND gate perform?","answer":"It produces a 0 at its output only if all inputs are 1","sub":"E7A"},{"id":"E7A08","question":"What logical operation does an OR gate perform?","answer":"It produces a 1 at its output if any input is 1","sub":"E7A"},{"id":"E7A09","question":"What logical operation is performed by a two-input exclusive NOR gate?","answer":"It produces a 0 at its output if one and only one of its inputs is 1","sub":"E7A"},{"id":"E7A10","question":"What is a truth table?","answer":"A list of inputs and corresponding outputs for a digital device","sub":"E7A"},{"id":"E7A11","question":"What does \u201cpositive logic\u201d mean in reference to logic devices?","answer":"High voltage represents a 1, low voltage a 0","sub":"E7A"},{"id":"E7B01","question":"For what portion of the signal cycle does each active element in a push-pull, Class AB amplifier conduct?","answer":"More than 180 degrees but less than 360 degrees","sub":"E7B"},{"id":"E7B02","question":"What is a Class D amplifier?","answer":"An amplifier that uses switching technology to achieve high efficiency","sub":"E7B"},{"id":"E7B03","question":"What circuit is required at the output of an RF switching amplifier?","answer":"A filter to remove harmonic content","sub":"E7B"},{"id":"E7B04","question":"What is the operating point of a Class A common emitter amplifier?","answer":"Approximately halfway between saturation and cutoff","sub":"E7B"},{"id":"E7B05","question":"What can be done to prevent unwanted oscillations in an RF power amplifier?","answer":"Install parasitic suppressors and/or neutralize the stage","sub":"E7B"},{"id":"E7B06","question":"What is a characteristic of a grounded-grid amplifier?","answer":"Low input impedance","sub":"E7B"},{"id":"E7B07","question":"Which of the following is the likely result of using a Class C amplifier to amplify a single-sideband phone signal?","answer":"Signal distortion and excessive bandwidth","sub":"E7B"},{"id":"E7B08","question":"Why are switching amplifiers more efficient than linear amplifiers?","answer":"The switching device is at saturation or cutoff most of the time","sub":"E7B"},{"id":"E7B09","question":"What is characteristic of an emitter follower (or common collector) amplifier?","answer":"Input and output signals in-phase","sub":"E7B"},{"id":"E7B10","question":"In Figure E7-1, what is the purpose of R1 and R2?","answer":"Voltage divider bias","sub":"E7B"},{"id":"E7B11","question":"In Figure E7-1, what is the purpose of R3?","answer":"Self bias","sub":"E7B"},{"id":"E7B12","question":"What type of amplifier circuit is shown in Figure E7-1?","answer":"Common emitter","sub":"E7B"},{"id":"E7C01","question":"How are the capacitors and inductors of a low-pass filter Pi-network arranged between the network\u2019s input and output?","answer":"A capacitor is connected between the input and ground, another capacitor is connected between the output and ground, and an inductor is connected between the input and output","sub":"E7C"},{"id":"E7C02","question":"What is the frequency response of a T-network with series capacitors and a shunt inductor?","answer":"High-pass","sub":"E7C"},{"id":"E7C03","question":"What is the purpose of adding an inductor to a Pi-network to create a Pi-L-network?","answer":"Greater harmonic suppression","sub":"E7C"},{"id":"E7C04","question":"How does an impedance-matching circuit transform a complex impedance to a resistive impedance?","answer":"It cancels the reactive part of the impedance and changes the resistive part to the desired value","sub":"E7C"},{"id":"E7C05","question":"Which filter type has ripple in the passband and a sharp cutoff?","answer":"A Chebyshev filter","sub":"E7C"},{"id":"E7C06","question":"What are the characteristics of an elliptical filter?","answer":"Extremely sharp cutoff with one or more notches in the stop band","sub":"E7C"},{"id":"E7C07","question":"Which describes a Pi-L network?","answer":"A Pi-network with an additional output series inductor","sub":"E7C"},{"id":"E7C08","question":"Which of the following is most frequently used as a band-pass or notch filter in VHF and UHF transceivers?","answer":"A helical filter","sub":"E7C"},{"id":"E7C09","question":"What is a crystal lattice filter?","answer":"A filter for low-level signals made using quartz crystals","sub":"E7C"},{"id":"E7C10","question":"Which of the following filters is used in a 2-meter band repeater duplexer?","answer":"A cavity filter","sub":"E7C"},{"id":"E7C11","question":"Which of the following measures a filter\u2019s ability to reject signals in adjacent channels?","answer":"Shape factor","sub":"E7C"},{"id":"E7D01","question":"How does a linear electronic voltage regulator work?","answer":"The conduction of a control element is varied to maintain a constant output voltage","sub":"E7D"},{"id":"E7D02","question":"How does a switchmode voltage regulator work?","answer":"By varying the duty cycle of pulses input to a filter","sub":"E7D"},{"id":"E7D03","question":"What device is used as a stable voltage reference?","answer":"A Zener diode","sub":"E7D"},{"id":"E7D04","question":"Which of the following describes a three-terminal voltage regulator?","answer":"A series regulator","sub":"E7D"},{"id":"E7D05","question":"Which of the following types of linear voltage regulator operates by loading the unregulated voltage source?","answer":"A shunt regulator","sub":"E7D"},{"id":"E7D06","question":"What is the purpose of Q1 in the circuit shown in Figure E7-2?","answer":"It controls the current to keep the output voltage constant","sub":"E7D"},{"id":"E7D07","question":"What is the purpose of C2 in the circuit shown in Figure E7-2?","answer":"It bypasses rectifier output ripple around D1","sub":"E7D"},{"id":"E7D08","question":"What type of circuit is shown in Figure E7-2?","answer":"Linear voltage regulator","sub":"E7D"},{"id":"E7D09","question":"How is battery operating time calculated?","answer":"Capacity in amp-hours divided by average current","sub":"E7D"},{"id":"E7D10","question":"Why is a switching type power supply less expensive and lighter than an equivalent linear power supply?","answer":"The high frequency inverter design uses much smaller transformers and filter components for an equivalent power output","sub":"E7D"},{"id":"E7D11","question":"What is the purpose of an inverter connected to a solar panel output?","answer":"Convert the panel\u2019s output from DC to AC","sub":"E7D"},{"id":"E7D12","question":"What is the dropout voltage of a linear voltage regulator?","answer":"Minimum input-to-output voltage required to maintain regulation","sub":"E7D"},{"id":"E7D13","question":"Which of the following calculates power dissipated by a series linear voltage regulator?","answer":"Voltage difference from input to output multiplied by output current","sub":"E7D"},{"id":"E7D14","question":"What is the purpose of connecting equal-value resistors across power supply filter capacitors connected in series?","answer":"All these choices are correct","sub":"E7D"},{"id":"E7D15","question":"What is the purpose of a step-start circuit in a high-voltage power supply?","answer":"To allow the filter capacitors to charge gradually","sub":"E7D"},{"id":"E7E01","question":"Which of the following can be used to generate FM phone signals?","answer":"Reactance modulation of a local oscillator","sub":"E7E"},{"id":"E7E02","question":"What is the function of a reactance modulator?","answer":"Produce PM or FM signals by varying a capacitance","sub":"E7E"},{"id":"E7E03","question":"What is a frequency discriminator?","answer":"A circuit for detecting FM signals","sub":"E7E"},{"id":"E7E04","question":"What is one way to produce a single-sideband phone signal?","answer":"Use a balanced modulator followed by a filter","sub":"E7E"},{"id":"E7E05","question":"What is added to an FM speech channel to boost the higher audio frequencies?","answer":"A pre-emphasis network","sub":"E7E"},{"id":"E7E06","question":"Why is de-emphasis used in FM communications receivers?","answer":"For compatibility with transmitters using phase modulation","sub":"E7E"},{"id":"E7E07","question":"What is meant by the term \u201cbaseband\u201d in radio communications?","answer":"The frequency range occupied by a message signal prior to modulation","sub":"E7E"},{"id":"E7E08","question":"What are the principal frequencies that appear at the output of a mixer?","answer":"The two input frequencies along with their sum and difference frequencies","sub":"E7E"},{"id":"E7E09","question":"What occurs when the input signal levels to a mixer are too high?","answer":"Spurious mixer products are generated","sub":"E7E"},{"id":"E7E10","question":"How does a diode envelope detector function?","answer":"By rectification and filtering of RF signals","sub":"E7E"},{"id":"E7E11","question":"Which type of detector is used for demodulating SSB signals?","answer":"Product detector","sub":"E7E"},{"id":"E7F01","question":"What is meant by \u201cdirect sampling\u201d in software defined radios?","answer":"Incoming RF is digitized by an analog-to-digital converter without being mixed with a local oscillator signal","sub":"E7F"},{"id":"E7F02","question":"What kind of digital signal processing audio filter is used to remove unwanted noise from a received SSB signal?","answer":"An adaptive filter","sub":"E7F"},{"id":"E7F03","question":"What type of digital signal processing filter is used to generate an SSB signal?","answer":"A Hilbert-transform filter","sub":"E7F"},{"id":"E7F04","question":"Which method generates an SSB signal using digital signal processing?","answer":"Signals are combined in quadrature phase relationship","sub":"E7F"},{"id":"E7F05","question":"How frequently must an analog signal be sampled to be accurately reproduced?","answer":"At least twice the rate of the highest frequency component of the signal","sub":"E7F"},{"id":"E7F06","question":"What is the minimum number of bits required to sample a signal with a range of 1 volt at a resolution of 1 millivolt?","answer":"10 bits","sub":"E7F"},{"id":"E7F07","question":"What function is performed by a Fast Fourier Transform?","answer":"Converting signals from the time domain to the frequency domain","sub":"E7F"},{"id":"E7F08","question":"What is the function of decimation?","answer":"Reducing the effective sample rate by removing samples","sub":"E7F"},{"id":"E7F09","question":"Why is an anti-aliasing filter required in a decimator?","answer":"It removes high-frequency signal components that would otherwise be reproduced as lower frequency components","sub":"E7F"},{"id":"E7F10","question":"What aspect of receiver analog-to-digital conversion determines the maximum receive bandwidth of a direct-sampling software defined radio (SDR)?","answer":"Sample rate","sub":"E7F"},{"id":"E7F11","question":"What sets the minimum detectable signal level for a direct-sampling software defined receiver in the absence of atmospheric or thermal noise?","answer":"Reference voltage level and sample width in bits","sub":"E7F"},{"id":"E7F12","question":"Which of the following is generally true of Finite Impulse Response (FIR) filters?","answer":"FIR filters can delay all frequency components of the signal by the same amount","sub":"E7F"},{"id":"E7F13","question":"What is the function of taps in a digital signal processing filter?","answer":"Provide incremental signal delays for filter algorithms","sub":"E7F"},{"id":"E7F14","question":"Which of the following would allow a digital signal processing filter to create a sharper filter response?","answer":"More taps","sub":"E7F"},{"id":"E7G01","question":"What is the typical output impedance of an op-amp?","answer":"Very low","sub":"E7G"},{"id":"E7G02","question":"What is the frequency response of the circuit in E7-3 if a capacitor is added across the feedback resistor?","answer":"Low-pass filter","sub":"E7G"},{"id":"E7G03","question":"What is the typical input impedance of an op-amp?","answer":"Very high","sub":"E7G"},{"id":"E7G04","question":"What is meant by the term \u201cop-amp input offset voltage\u201d?","answer":"The differential input voltage needed to bring the open loop output voltage to zero","sub":"E7G"},{"id":"E7G05","question":"How can unwanted ringing and audio instability be prevented in an op-amp audio filter?","answer":"Restrict both gain and Q","sub":"E7G"},{"id":"E7G06","question":"What is the gain-bandwidth of an operational amplifier?","answer":"The frequency at which the open-loop gain of the amplifier equals one","sub":"E7G"},{"id":"E7G07","question":"What voltage gain can be expected from the circuit in Figure E7-3 when R1 is 10 ohms and RF is 470 ohms?","answer":"47","sub":"E7G"},{"id":"E7G08","question":"How does the gain of an ideal operational amplifier vary with frequency?","answer":"It does not vary with frequency","sub":"E7G"},{"id":"E7G09","question":"What will be the output voltage of the circuit shown in Figure E7-3 if R1 is 1,000 ohms, RF is 10,000 ohms, and 0.23 volts DC is applied to the input?","answer":"-2.3 volts","sub":"E7G"},{"id":"E7G10","question":"What absolute voltage gain can be expected from the circuit in Figure E7-3 when R1 is 1,800 ohms and RF is 68 kilohms?","answer":"38","sub":"E7G"},{"id":"E7G11","question":"What absolute voltage gain can be expected from the circuit in Figure E7-3 when R1 is 3,300 ohms and RF is 47 kilohms?","answer":"14","sub":"E7G"},{"id":"E7G12","question":"What is an operational amplifier?","answer":"A high-gain, direct-coupled differential amplifier with very high input impedance and very low output impedance","sub":"E7G"},{"id":"E7H01","question":"What are three common oscillator circuits?","answer":"Colpitts, Hartley, and Pierce","sub":"E7H"},{"id":"E7H02","question":"What is a microphonic?","answer":"Changes in oscillator frequency caused by mechanical vibration","sub":"E7H"},{"id":"E7H03","question":"What is a phase-locked loop?","answer":"An electronic servo loop consisting of a phase detector, a low-pass filter, a voltage-controlled oscillator, and a stable reference oscillator","sub":"E7H"},{"id":"E7H04","question":"How is positive feedback supplied in a Colpitts oscillator?","answer":"Through a capacitive divider","sub":"E7H"},{"id":"E7H05","question":"How is positive feedback supplied in a Pierce oscillator?","answer":"Through a quartz crystal","sub":"E7H"},{"id":"E7H06","question":"Which of these functions can be performed by a phase-locked loop?","answer":"Frequency synthesis and FM demodulation","sub":"E7H"},{"id":"E7H07","question":"How can an oscillator\u2019s microphonic responses be reduced?","answer":"Mechanically isolate the oscillator circuitry from its enclosure","sub":"E7H"},{"id":"E7H08","question":"Which of the following components can be used to reduce thermal drift in crystal oscillators?","answer":"NP0 capacitors","sub":"E7H"},{"id":"E7H09","question":"What type of frequency synthesizer circuit uses a phase accumulator, lookup table, digital-to-analog converter, and a low-pass anti-alias filter?","answer":"A direct digital synthesizer","sub":"E7H"},{"id":"E7H10","question":"What information is contained in the lookup table of a direct digital synthesizer (DDS)?","answer":"Amplitude values that represent the desired waveform","sub":"E7H"},{"id":"E7H11","question":"What are the major spectral impurity components of direct digital synthesizers?","answer":"Spurious signals at discrete frequencies","sub":"E7H"},{"id":"E7H12","question":"Which of the following ensures that a crystal oscillator operates on the frequency specified by the crystal manufacturer?","answer":"Provide the crystal with a specified parallel capacitance","sub":"E7H"},{"id":"E7H13","question":"Which of the following is a technique for providing highly accurate and stable oscillators needed for microwave transmission and reception?","answer":"All these choices are correct","sub":"E7H"},{"id":"E8A01","question":"What technique shows that a square wave is made up of a sine wave and its odd h
