const CARDS = [{"id":"G1A01","question":"On which HF and/or MF amateur bands are there portions where General class licensees cannot transmit?","answer":"80 meters, 40 meters, 20 meters, and 15 meters","sub":"G1A"},{"id":"G1A02","question":"On which of the following bands is phone operation prohibited?","answer":"30 meters","sub":"G1A"},{"id":"G1A03","question":"On which of the following bands is image transmission prohibited?","answer":"30 meters","sub":"G1A"},{"id":"G1A05","question":"On which of the following frequencies are General class licensees prohibited from operating as control operator?","answer":"7.125 MHz to 7.175 MHz","sub":"G1A"},{"id":"G1A06","question":"Which of the following applies when the FCC rules designate the amateur service as a secondary user on a band?","answer":"Amateur stations must not cause harmful interference to primary users and must accept interference from primary users","sub":"G1A"},{"id":"G1A07","question":"On which amateur frequencies in the 10-meter band may stations with a General class control operator transmit CW emissions?","answer":"The entire band","sub":"G1A"},{"id":"G1A08","question":"Which HF bands have segments exclusively allocated to Amateur Extra licensees?","answer":"80 meters, 40 meters, 20 meters, and 15 meters","sub":"G1A"},{"id":"G1A09","question":"Which of the following frequencies is within the General class portion of the 15-meter band?","answer":"21300 kHz","sub":"G1A"},{"id":"G1A10","question":"What portion of the 10-meter band is available for repeater use?","answer":"The portion above 29.5 MHz","sub":"G1A"},{"id":"G1A11","question":"When General class licensees are not permitted to use the entire voice portion of a band, which portion of the voice segment is available to them?","answer":"The upper frequency portion","sub":"G1A"},{"id":"G1B01","question":"What is the maximum height above ground for an antenna structure not near a public use airport without requiring notification to the FAA and registration with the FCC?","answer":"200 feet","sub":"G1B"},{"id":"G1B02","question":"With which of the following conditions must beacon stations comply?","answer":"No more than one beacon station may transmit in the same band from the same station location","sub":"G1B"},{"id":"G1B03","question":"Which of the following is a purpose of a beacon station as identified in the FCC rules?","answer":"Observation of propagation and reception","sub":"G1B"},{"id":"G1B04","question":"Which of the following transmissions is permitted for all amateur stations?","answer":"Occasional retransmission of weather and propagation forecast information from US government stations","sub":"G1B"},{"id":"G1B05","question":"Which of the following one-way transmissions are permitted?","answer":"Transmissions to assist with learning the International Morse code","sub":"G1B"},{"id":"G1B06","question":"Under what conditions are state and local governments permitted to regulate amateur radio antenna structures?","answer":"Amateur Service communications must be reasonably accommodated, and regulations must constitute the minimum practical to accommodate a legitimate purpose of the state or local entity","sub":"G1B"},{"id":"G1B07","question":"What are the restrictions on the use of abbreviations or procedural signals in the amateur service?","answer":"They may be used if they do not obscure the meaning of a message","sub":"G1B"},{"id":"G1B08","question":"When is it permissible to communicate with amateur stations in countries outside the areas administered by the Federal Communications Commission?","answer":"When the contact is with amateurs in any country except those whose administrations have notified the ITU that they object to such communications","sub":"G1B"},{"id":"G1B09","question":"On what HF frequencies are automatically controlled beacons permitted?","answer":"28.20 MHz to 28.30 MHz","sub":"G1B"},{"id":"G1B10","question":"What is the power limit for beacon stations?","answer":"100 watts PEP output","sub":"G1B"},{"id":"G1B11","question":"Who or what determines \u201cgood engineering and good amateur practice,\u201d as applied to the operation of an amateur station in all respects not covered by the Part 97 rules?","answer":"The FCC","sub":"G1B"},{"id":"G1C01","question":"What is the maximum transmitter power an amateur station may use on 10.140 MHz?","answer":"200 watts PEP output","sub":"G1C"},{"id":"G1C02","question":"What is the maximum transmitter power an amateur station may use on the 12-meter band?","answer":"1500 watts PEP output","sub":"G1C"},{"id":"G1C03","question":"What is the maximum bandwidth permitted by FCC rules for amateur radio stations transmitting on USB frequencies in the 60-meter band?","answer":"2.8 kHz","sub":"G1C"},{"id":"G1C04","question":"Which of the following is required by the FCC rules when operating in the 60-meter band?","answer":"If you are using an antenna other than a dipole, you must keep a record of the gain of your antenna","sub":"G1C"},{"id":"G1C05","question":"What is the limit for transmitter power on the 28 MHz band for a General Class control operator?","answer":"1500 watts PEP output","sub":"G1C"},{"id":"G1C06","question":"What is the limit for transmitter power on the 1.8 MHz band?","answer":"1500 watts PEP output","sub":"G1C"},{"id":"G1C07","question":"What must be done before using a new digital protocol on the air?","answer":"Publicly document the technical characteristics of the protocol","sub":"G1C"},{"id":"G1C11","question":"What measurement is specified by FCC rules that regulate maximum power?","answer":"PEP output from the transmitter","sub":"G1C"},{"id":"G1D01","question":"Who may receive partial credit for the elements represented by an expired amateur radio license?","answer":"Any person who can demonstrate that they once held an FCC-issued General, Advanced, or Amateur Extra class license that was not revoked by the FCC","sub":"G1D"},{"id":"G1D02","question":"What license examinations may you administer as an accredited Volunteer Examiner holding a General class operator license?","answer":"Technician only","sub":"G1D"},{"id":"G1D03","question":"On which of the following band segments may you operate if you are a Technician class operator and have an unexpired Certificate of Successful Completion of Examination (CSCE) for General class privileges?","answer":"On any General or Technician class band segment","sub":"G1D"},{"id":"G1D04","question":"Who must observe the administration of a Technician class license examination?","answer":"At least three Volunteer Examiners of General class or higher","sub":"G1D"},{"id":"G1D05","question":"When operating a US station by remote control from outside the country, what license is required of the control operator?","answer":"A US operator/primary station license","sub":"G1D"},{"id":"G1D06","question":"Until an upgrade to General class is shown in the FCC database, when must a Technician licensee identify with \u201cAG\u201d after their call sign?","answer":"Whenever they operate using General class frequency privileges","sub":"G1D"},{"id":"G1D07","question":"Volunteer Examiners are accredited by what organization?","answer":"A Volunteer Examiner Coordinator","sub":"G1D"},{"id":"G1D08","question":"Which of the following criteria must be met for a non-US citizen to be an accredited Volunteer Examiner?","answer":"The person must hold an FCC granted amateur radio license of General class or above","sub":"G1D"},{"id":"G1D09","question":"How long is a Certificate of Successful Completion of Examination (CSCE) valid for exam element credit?","answer":"365 days","sub":"G1D"},{"id":"G1D10","question":"What is the minimum age that one must be to qualify as an accredited Volunteer Examiner?","answer":"18 years","sub":"G1D"},{"id":"G1D11","question":"What action is required to obtain a new General class license after a previously held license has expired and the two-year grace period has passed?","answer":"The applicant must show proof of the appropriate expired license grant and pass the current Element 2 exam","sub":"G1D"},{"id":"G1D12","question":"When operating a station in South America by remote control over the internet from the US, what regulations apply?","answer":"Only those of the remote station\u2019s country","sub":"G1D"},{"id":"G1E01","question":"Which of the following would disqualify a third party from participating in sending a message via an amateur station?","answer":"The third party\u2019s amateur license has been revoked and not reinstated","sub":"G1E"},{"id":"G1E02","question":"When may a 10-meter repeater retransmit the 2-meter signal from a station that has a Technician class control operator?","answer":"Only if the 10-meter repeater control operator holds at least a General class license","sub":"G1E"},{"id":"G1E03","question":"What is required to conduct communications with a digital station operating under automatic control outside the automatic control band segments?","answer":"The station initiating the contact must be under local or remote control","sub":"G1E"},{"id":"G1E04","question":"Which of the following conditions require a licensed amateur radio operator to take specific steps to avoid harmful interference to other users or facilities?","answer":"All these choices are correct","sub":"G1E"},{"id":"G1E05","question":"What are the restrictions on messages sent to a third party in a country with which there is a Third-Party Agreement?","answer":"They must relate to amateur radio, or remarks of a personal character, or messages relating to emergencies or disaster relief","sub":"G1E"},{"id":"G1E06","question":"The frequency allocations of which ITU region apply to radio amateurs operating in North and South America?","answer":"Region 2","sub":"G1E"},{"id":"G1E07","question":"In what part of the 2.4 GHz band may an amateur station communicate with non-licensed Wi-Fi stations?","answer":"No part","sub":"G1E"},{"id":"G1E08","question":"What is the maximum PEP output allowed for spread spectrum transmissions?","answer":"10 watts","sub":"G1E"},{"id":"G1E10","question":"Why should an amateur operator normally avoid transmitting on 14.100, 18.110, 21.150, 24.930 and 28.200 MHz?","answer":"A system of propagation beacon stations operates on those frequencies","sub":"G1E"},{"id":"G1E11","question":"On what bands may automatically controlled stations transmitting RTTY or data emissions communicate with other automatically controlled digital stations?","answer":"Anywhere in the 6-meter or shorter wavelength bands, and in limited segments of some of the HF bands","sub":"G1E"},{"id":"G1E12","question":"When may third-party messages be transmitted via remote control?","answer":"Under any circumstances in which third party messages are permitted by FCC rules","sub":"G1E"},{"id":"G2A01","question":"Which mode is most commonly used for voice communications on frequencies of 14 MHz or higher?","answer":"Upper sideband","sub":"G2A"},{"id":"G2A02","question":"Which mode is most commonly used for voice communications on the 160-, 75-, and 40-meter bands?","answer":"Lower sideband","sub":"G2A"},{"id":"G2A03","question":"Which mode is most commonly used for SSB voice communications in the VHF and UHF bands?","answer":"Upper sideband","sub":"G2A"},{"id":"G2A04","question":"Which mode is most commonly used for voice communications on the 17- and 12-meter bands?","answer":"Upper sideband","sub":"G2A"},{"id":"G2A05","question":"Which mode of voice communication is most commonly used on the HF amateur bands?","answer":"Single sideband","sub":"G2A"},{"id":"G2A06","question":"Which of the following is an advantage of using single sideband, as compared to other analog voice modes on the HF amateur bands?","answer":"Less bandwidth used and greater power efficiency","sub":"G2A"},{"id":"G2A07","question":"Which of the following statements is true of single sideband (SSB)?","answer":"Only one sideband is transmitted; the other sideband and carrier are suppressed","sub":"G2A"},{"id":"G2A08","question":"What is the recommended way to break into a phone contact?","answer":"Say your call sign once","sub":"G2A"},{"id":"G2A09","question":"Why do most amateur stations use lower sideband on the 160-, 75-, and 40-meter bands?","answer":"It is commonly accepted amateur practice","sub":"G2A"},{"id":"G2A10","question":"Which of the following statements is true of VOX operation versus PTT operation?","answer":"It allows \u201chands free\u201d operation","sub":"G2A"},{"id":"G2A11","question":"Generally, who should respond to a station in the contiguous 48 states calling \u201cCQ DX\u201d?","answer":"Any stations outside the lower 48 states","sub":"G2A"},{"id":"G2A12","question":"What control is typically adjusted for proper ALC setting on a single sideband transceiver?","answer":"Transmit audio or microphone gain","sub":"G2A"},{"id":"G2B01","question":"Which of the following is true concerning access to frequencies?","answer":"Except during emergencies, no amateur station has priority access to any frequency","sub":"G2B"},{"id":"G2B02","question":"What is the first thing you should do if you are communicating with another amateur station and hear a station in distress break in?","answer":"Acknowledge the station in distress and determine what assistance may be needed","sub":"G2B"},{"id":"G2B03","question":"What is good amateur practice if propagation changes during a contact creating interference from other stations using the frequency?","answer":"Attempt to resolve the interference problem with the other stations in a mutually acceptable manner","sub":"G2B"},{"id":"G2B04","question":"When selecting a CW transmitting frequency, what minimum separation from other stations should be used to minimize interference to stations on adjacent frequencies?","answer":"150 Hz to 500 Hz","sub":"G2B"},{"id":"G2B05","question":"When selecting an SSB transmitting frequency, what minimum separation should be used to minimize interference to stations on adjacent frequencies?","answer":"2 kHz to 3 kHz","sub":"G2B"},{"id":"G2B06","question":"How can you avoid harmful interference on an apparently clear frequency before calling CQ on CW or phone?","answer":"Send \u201cQRL?\u201d on CW, followed by your call sign; or, if using phone, ask if the frequency is in use, followed by your call sign","sub":"G2B"},{"id":"G2B07","question":"Which of the following complies with commonly accepted amateur practice when choosing a frequency on which to initiate a call?","answer":"Follow the voluntary band plan","sub":"G2B"},{"id":"G2B08","question":"What is the voluntary band plan restriction for US stations transmitting within the 48 contiguous states in the 50.1 MHz to 50.125 MHz band segment?","answer":"Only contacts with stations not within the 48 contiguous states","sub":"G2B"},{"id":"G2B09","question":"Who may be the control operator of an amateur station transmitting in RACES to assist relief operations during a disaster?","answer":"Only a person holding an FCC-issued amateur operator license","sub":"G2B"},{"id":"G2B10","question":"Which of the following is good amateur practice for net management?","answer":"Have a backup frequency in case of interference or poor conditions","sub":"G2B"},{"id":"G2B11","question":"How often may RACES training drills and tests be routinely conducted without special authorization?","answer":"No more than 1 hour per week","sub":"G2B"},{"id":"G2C01","question":"Which of the following describes full break-in CW operation (QSK)?","answer":"Transmitting stations can receive between code characters and elements","sub":"G2C"},{"id":"G2C02","question":"What should you do if a CW station sends \u201cQRS?\u201d","answer":"Send slower","sub":"G2C"},{"id":"G2C03","question":"What does it mean when a CW operator sends \u201cKN\u201d at the end of a transmission?","answer":"Listening only for a specific station or stations","sub":"G2C"},{"id":"G2C04","question":"What does the Q signal \u201cQRL?\u201d mean?","answer":"\u201cAre you busy?\u201d or \u201cIs this frequency in use?\u201d","sub":"G2C"},{"id":"G2C05","question":"What is the best speed to use when answering a CQ in Morse code?","answer":"The fastest speed at which you are comfortable copying, but no faster than the CQ","sub":"G2C"},{"id":"G2C06","question":"What does the term \u201czero beat\u201d mean in CW operation?","answer":"Matching the transmit frequency to the frequency of a received signal","sub":"G2C"},{"id":"G2C07","question":"When sending CW, what does a \u201cC\u201d mean when added to the RST report?","answer":"Chirpy or unstable signal","sub":"G2C"},{"id":"G2C08","question":"What prosign is sent to indicate the end of a formal message when using CW?","answer":"AR","sub":"G2C"},{"id":"G2C09","question":"What does the Q signal \u201cQSL\u201d mean?","answer":"I have received and understood","sub":"G2C"},{"id":"G2C10","question":"What does the Q signal \u201cQRN\u201d mean?","answer":"I am troubled by static","sub":"G2C"},{"id":"G2C11","question":"What does the Q signal \u201cQRV\u201d mean?","answer":"I am ready to receive","sub":"G2C"},{"id":"G2D01","question":"What is the Volunteer Monitor Program?","answer":"Amateur volunteers who are formally enlisted to monitor the airwaves for rules violations","sub":"G2D"},{"id":"G2D02","question":"Which of the following are objectives of the Volunteer Monitor Program?","answer":"To encourage amateur radio operators to self-regulate and comply with the rules","sub":"G2D"},{"id":"G2D03","question":"What procedure may be used by Volunteer Monitors to localize a station whose continuous carrier is holding a repeater on in their area?","answer":"Compare beam headings on the repeater input from their home locations with that of other Volunteer Monitors","sub":"G2D"},{"id":"G2D04","question":"Which of the following describes an azimuthal projection map?","answer":"A map that shows true bearings and distances from a specific location","sub":"G2D"},{"id":"G2D05","question":"Which of the following indicates that you are looking for an HF contact with any station?","answer":"Repeat \u201cCQ\u201d a few times, followed by \u201cthis is,\u201d then your call sign a few times, then pause to listen, repeat as necessary","sub":"G2D"},{"id":"G2D06","question":"How is a directional antenna pointed when making a \u201clong-path\u201d contact with another station?","answer":"180 degrees from the station\u2019s short-path heading","sub":"G2D"},{"id":"G2D07","question":"Which of the following are examples of the NATO Phonetic Alphabet?","answer":"Alpha, Bravo, Charlie, Delta","sub":"G2D"},{"id":"G2D08","question":"Why do many amateurs keep a station log?","answer":"To help with a reply if the FCC requests information about your station","sub":"G2D"},{"id":"G2D09","question":"Which of the following is required when participating in a contest on HF frequencies?","answer":"Identify your station according to normal FCC regulations","sub":"G2D"},{"id":"G2D10","question":"What is QRP operation?","answer":"Low-power transmit operation","sub":"G2D"},{"id":"G2D11","question":"Why are signal reports typically exchanged at the beginning of an HF contact?","answer":"To allow each station to operate according to conditions","sub":"G2D"},{"id":"G2E01","question":"Which mode is normally used when sending RTTY signals via AFSK with an SSB transmitter?","answer":"LSB","sub":"G2E"},{"id":"G2E02","question":"What is VARA?","answer":"A digital protocol used with Winlink","sub":"G2E"},{"id":"G2E03","question":"What symptoms may result from other signals interfering with a PACTOR or VARA transmission?","answer":"All these choices are correct","sub":"G2E"},{"id":"G2E04","question":"Which of the following is good practice when choosing a transmitting frequency to answer a station calling CQ using FT8?","answer":"Find a clear frequency during the alternate time slot to the calling station","sub":"G2E"},{"id":"G2E05","question":"What is the standard sideband for JT65, JT9, FT4, or FT8 digital signal when using AFSK?","answer":"USB","sub":"G2E"},{"id":"G2E06","question":"What is the most common frequency shift for RTTY emissions in the amateur HF bands?","answer":"170 Hz","sub":"G2E"},{"id":"G2E07","question":"Which of the following is required when using FT8?","answer":"Computer time accurate to within approximately 1 second","sub":"G2E"},{"id":"G2E08","question":"In what segment of the 20-meter band are most digital mode operations commonly found?","answer":"Between 14.070 MHz and 14.100 MHz","sub":"G2E"},{"id":"G2E09","question":"How do you join a contact between two stations using the PACTOR protocol?","answer":"Joining an existing contact is not possible, PACTOR connections are limited to two stations","sub":"G2E"},{"id":"G2E10","question":"Which of the following is a way to establish contact with a digital messaging system gateway station?","answer":"Transmit a connect message on the station\u2019s published frequency","sub":"G2E"},{"id":"G2E11","question":"What is the primary purpose of an Amateur Radio Emergency Data Network (AREDN) mesh network?","answer":"To provide high-speed data services during an emergency or community event","sub":"G2E"},{"id":"G2E12","question":"Which of the following describes Winlink?","answer":"All these choices are correct","sub":"G2E"},{"id":"G2E13","question":"What is another name for a Winlink Remote Message Server?","answer":"Gateway","sub":"G2E"},{"id":"G2E14","question":"What could be wrong if you cannot decode an RTTY or other FSK signal even though it is apparently tuned in properly?","answer":"All these choices are correct","sub":"G2E"},{"id":"G2E15","question":"Which of the following is a common location for FT8?","answer":"Approximately 14.074 MHz to 14.077 MHz","sub":"G2E"},{"id":"G3A01","question":"How does a higher sunspot number affect HF propagation?","answer":"Higher sunspot numbers generally indicate a greater probability of good propagation at higher frequencies","sub":"G3A"},{"id":"G3A02","question":"What effect does a sudden ionospheric disturbance have on the daytime ionospheric propagation?","answer":"It disrupts signals on lower frequencies more than those on higher frequencies","sub":"G3A"},{"id":"G3A03","question":"Approximately how long does it take the increased ultraviolet and X-ray radiation from a solar flare to affect radio propagation on Earth?","answer":"8 minutes","sub":"G3A"},{"id":"G3A04","question":"Which of the following are the least reliable bands for long-distance communications during periods of low solar activity?","answer":"15 meters, 12 meters, and 10 meters","sub":"G3A"},{"id":"G3A05","question":"What is the solar flux index?","answer":"A measure of solar radiation with a wavelength of 10.7 centimeters","sub":"G3A"},{"id":"G3A06","question":"What is a geomagnetic storm?","answer":"A temporary disturbance in Earth\u2019s geomagnetic field","sub":"G3A"},{"id":"G3A07","question":"At what point in the solar cycle does the 20-meter band usually support worldwide propagation during daylight hours?","answer":"At any point","sub":"G3A"},{"id":"G3A08","question":"How can a geomagnetic storm affect HF propagation?","answer":"Degrade high-latitude HF propagation","sub":"G3A"},{"id":"G3A09","question":"How can high geomagnetic activity benefit radio communications?","answer":"Creates auroras that can reflect VHF signals","sub":"G3A"},{"id":"G3A10","question":"What causes HF propagation conditions to vary periodically in a 26- to 28-day cycle?","answer":"Rotation of the Sun\u2019s surface layers around its axis","sub":"G3A"},{"id":"G3A11","question":"How long does it take a coronal mass ejection to affect radio propagation on Earth?","answer":"15 hours to several days","sub":"G3A"},{"id":"G3A12","question":"What does the K-index measure?","answer":"The short-term stability of Earth\u2019s geomagnetic field","sub":"G3A"},{"id":"G3A13","question":"What does the A-index measure?","answer":"The long-term stability of Earth\u2019s geomagnetic field","sub":"G3A"},{"id":"G3A14","question":"How is long distance radio communication usually affected by the charged particles that reach Earth from solar coronal holes?","answer":"HF communication is disturbed","sub":"G3A"},{"id":"G3B01","question":"What is a characteristic of skywave signals arriving at your location by both short-path and long-path propagation?","answer":"A slightly delayed echo might be heard","sub":"G3B"},{"id":"G3B02","question":"What factors affect the MUF?","answer":"All these choices are correct","sub":"G3B"},{"id":"G3B03","question":"Which frequency will have the least attenuation for long-distance skip propagation?","answer":"Just below the MUF","sub":"G3B"},{"id":"G3B04","question":"Which of the following is a way to determine current propagation on a desired band from your station?","answer":"Use a network of automated receiving stations on the internet to see where your transmissions are being received","sub":"G3B"},{"id":"G3B05","question":"How does the ionosphere affect radio waves with frequencies below the MUF and above the LUF?","answer":"They are refracted back to Earth","sub":"G3B"},{"id":"G3B06","question":"What usually happens to radio waves with frequencies below the LUF?","answer":"They are attenuated before reaching the destination","sub":"G3B"},{"id":"G3B07","question":"What does LUF stand for?","answer":"The Lowest Usable Frequency for communications between two specific points","sub":"G3B"},{"id":"G3B08","question":"What does MUF stand for?","answer":"The Maximum Usable Frequency for communications between two points","sub":"G3B"},{"id":"G3B09","question":"What is the approximate maximum distance along the Earth\u2019s surface normally covered in one hop using the F2 region?","answer":"2,500 miles","sub":"G3B"},{"id":"G3B10","question":"What is the approximate maximum distance along the Earth\u2019s surface normally covered in one hop using the E region?","answer":"1,200 miles","sub":"G3B"},{"id":"G3B11","question":"What happens to HF propagation when the LUF exceeds the MUF?","answer":"Propagation via ordinary skywave communications is not possible over that path","sub":"G3B"},{"id":"G3B12","question":"Which of the following is typical of the lower HF frequencies during the summer?","answer":"High levels of atmospheric noise or static","sub":"G3B"},{"id":"G3C01","question":"Which ionospheric region is closest to the surface of Earth?","answer":"The D region","sub":"G3C"},{"id":"G3C02","question":"What is meant by the term \u201ccritical frequency\u201d at a given incidence angle?","answer":"The highest frequency which is refracted back to Earth","sub":"G3C"},{"id":"G3C03","question":"Why is skip propagation via the F2 region longer than that via the other ionospheric regions?","answer":"Because it is the highest","sub":"G3C"},{"id":"G3C04","question":"What does the term \u201ccritical angle\u201d mean, as applied to radio wave propagation?","answer":"The highest takeoff angle that will return a radio wave to Earth under specific ionospheric conditions","sub":"G3C"},{"id":"G3C05","question":"Why is long-distance communication on the 40-, 60-, 80-, and 160-meter bands more difficult during the day?","answer":"The D region absorbs signals at these frequencies during daylight hours","sub":"G3C"},{"id":"G3C06","question":"What is a characteristic of HF scatter?","answer":"Signals have a fluttering sound","sub":"G3C"},{"id":"G3C07","question":"What makes HF scatter signals often sound distorted?","answer":"Energy is scattered into the skip zone through several different paths","sub":"G3C"},{"id":"G3C08","question":"Why are HF scatter signals in the skip zone usually weak?","answer":"Only a small part of the signal energy is scattered into the skip zone","sub":"G3C"},{"id":"G3C09","question":"What type of propagation allows signals to be heard in the transmitting station\u2019s skip zone?","answer":"Scatter","sub":"G3C"},{"id":"G3C10","question":"What is near vertical incidence skywave (NVIS) propagation?","answer":"Short distance MF or HF propagation at high elevation angles","sub":"G3C"},{"id":"G3C11","question":"Which ionospheric region is the most absorbent of signals below 10 MHz during daylight hours?","answer":"The D region","sub":"G3C"},{"id":"G4A01","question":"What is the purpose of the notch filter found on many HF transceivers?","answer":"To reduce interference from carriers in the receiver passband","sub":"G4A"},{"id":"G4A02","question":"What is the benefit of using the opposite or \u201creverse\u201d sideband when receiving CW?","answer":"It may be possible to reduce or eliminate interference from other signals","sub":"G4A"},{"id":"G4A03","question":"How does a noise blanker work?","answer":"By reducing receiver gain during a noise pulse","sub":"G4A"},{"id":"G4A04","question":"What is the effect on plate current of the correct setting of a vacuum-tube RF power amplifier\u2019s TUNE control?","answer":"A pronounced dip","sub":"G4A"},{"id":"G4A05","question":"Why is automatic level control (ALC) used with an RF power amplifier?","answer":"To prevent excessive drive","sub":"G4A"},{"id":"G4A06","question":"What is the purpose of an antenna tuner?","answer":"Increase power transfer from the transmitter to the feed line","sub":"G4A"},{"id":"G4A07","question":"What happens as a receiver\u2019s noise reduction control level is increased?","answer":"Received signals may become distorted","sub":"G4A"},{"id":"G4A08","question":"What is the correct adjustment for the LOAD or COUPLING control of a vacuum tube RF power amplifier?","answer":"Desired power output without exceeding maximum allowable plate current","sub":"G4A"},{"id":"G4A09","question":"What is the purpose of delaying RF output after activating a transmitter\u2019s keying line to an external amplifier?","answer":"To allow time for the amplifier to switch the antenna between the transceiver and the amplifier output","sub":"G4A"},{"id":"G4A10","question":"What is the function of an electronic keyer?","answer":"Automatic generation of dots and dashes for CW operation","sub":"G4A"},{"id":"G4A11","question":"Why should the ALC system be inactive when transmitting AFSK data signals?","answer":"The ALC action distorts the signal","sub":"G4A"},{"id":"G4A12","question":"Which of the following is a common use of the dual-VFO feature on a transceiver?","answer":"To transmit on one frequency and listen on another","sub":"G4A"},{"id":"G4A13","question":"What is the purpose of using a receive attenuator?","answer":"To prevent receiver overload from strong incoming signals","sub":"G4A"},{"id":"G4B01","question":"What item of test equipment contains horizontal and vertical channel amplifiers?","answer":"An oscilloscope","sub":"G4B"},{"id":"G4B02","question":"Which of the following is an advantage of an oscilloscope versus a digital voltmeter?","answer":"Complex waveforms can be measured","sub":"G4B"},{"id":"G4B03","question":"Which of the following is the best instrument to use for checking the keying waveform of a CW transmitter?","answer":"An oscilloscope","sub":"G4B"},{"id":"G4B04","question":"What signal source is connected to the vertical input of an oscilloscope when checking the RF envelope pattern of a transmitted signal?","answer":"The attenuated RF output of the transmitter","sub":"G4B"},{"id":"G4B05","question":"Why do voltmeters have high input impedance?","answer":"It decreases the loading on circuits being measured","sub":"G4B"},{"id":"G4B06","question":"What is an advantage of a digital multimeter as compared to an analog multimeter?","answer":"Higher precision","sub":"G4B"},{"id":"G4B07","question":"What signals are used to conduct a two-tone test?","answer":"Two non-harmonically related audio signals","sub":"G4B"},{"id":"G4B08","question":"What transmitter performance parameter does a two-tone test analyze?","answer":"Linearity","sub":"G4B"},{"id":"G4B09","question":"When is an analog multimeter preferred to a digital multimeter?","answer":"When adjusting circuits for maximum or minimum values","sub":"G4B"},{"id":"G4B10","question":"Which of the following can be determined with a directional wattmeter?","answer":"Standing wave ratio","sub":"G4B"},{"id":"G4B11","question":"Which of the following must be connected to an antenna analyzer when it is being used for SWR measurements?","answer":"Antenna and feed line","sub":"G4B"},{"id":"G4B12","question":"What effect can strong signals from nearby transmitters have on an antenna analyzer?","answer":"Received power that interferes with SWR readings","sub":"G4B"},{"id":"G4B13","question":"Which of the following can be measured with an antenna analyzer?","answer":"Impedance of coaxial cable","sub":"G4B"},{"id":"G4C01","question":"Which of the following might be useful in reducing RF interference to audio frequency circuits?","answer":"Bypass capacitor","sub":"G4C"},{"id":"G4C02","question":"Which of the following could be a cause of interference covering a wide range of frequencies?","answer":"Arcing at a poor electrical connection","sub":"G4C"},{"id":"G4C03","question":"What sound is heard from an audio device experiencing RF interference from a single sideband phone transmitter?","answer":"Distorted speech","sub":"G4C"},{"id":"G4C04","question":"What sound is heard from an audio device experiencing RF interference from a CW transmitter?","answer":"On-and-off humming or clicking","sub":"G4C"},{"id":"G4C05","question":"What is a possible cause of high voltages that produce RF burns?","answer":"The ground wire has high impedance on that frequency","sub":"G4C"},{"id":"G4C06","question":"What is a possible effect of a resonant ground connection?","answer":"High RF voltages on the enclosures of station equipment","sub":"G4C"},{"id":"G4C07","question":"Why should soldered joints not be used in lightning protection ground connections?","answer":"A soldered joint will likely be destroyed by the heat of a lightning strike","sub":"G4C"},{"id":"G4C08","question":"Which of the following would reduce RF interference caused by common-mode current on an audio cable?","answer":"Place a ferrite choke on the cable","sub":"G4C"},{"id":"G4C09","question":"How can the effects of ground loops be minimized?","answer":"Bond equipment enclosures together","sub":"G4C"},{"id":"G4C10","question":"What could be a symptom caused by a ground loop in your station\u2019s audio connections?","answer":"You receive reports of \u201chum\u201d on your station\u2019s transmitted signal","sub":"G4C"},{"id":"G4C11","question":"What technique helps to minimize RF \u201chot spots\u201d in an amateur station?","answer":"Bonding all equipment enclosures together","sub":"G4C"},{"id":"G4C12","question":"Why must all metal enclosures of station equipment be grounded?","answer":"It ensures that hazardous voltages cannot appear on the chassis","sub":"G4C"},{"id":"G4D01","question":"What is the purpose of a speech processor in a transceiver?","answer":"Increase the apparent loudness of transmitted voice signals","sub":"G4D"},{"id":"G4D02","question":"How does a speech processor affect a single sideband phone signal?","answer":"It increases average power","sub":"G4D"},{"id":"G4D03","question":"What is the effect of an incorrectly adjusted speech processor?","answer":"All these choices are correct","sub":"G4D"},{"id":"G4D04","question":"What does an S meter measure?","answer":"Received signal strength","sub":"G4D"},{"id":"G4D05","question":"How does a signal that reads 20 dB over S9 compare to one that reads S9 on a receiver, assuming a properly calibrated S meter?","answer":"It is 100 times more powerful","sub":"G4D"},{"id":"G4D06","question":"How much change in signal strength is typically represented by one S unit?","answer":"6 dB","sub":"G4D"},{"id":"G4D07","question":"How much must the power output of a transmitter be raised to change the S meter reading on a distant receiver from S8 to S9?","answer":"Approximately 4 times","sub":"G4D"},{"id":"G4D08","question":"What frequency range is occupied by a 3 kHz LSB signal when the displayed carrier frequency is set to 7.178 MHz?","answer":"7.175 MHz to 7.178 MHz","sub":"G4D"},{"id":"G4D09","question":"What frequency range is occupied by a 3 kHz USB signal with the displayed carrier frequency set to 14.347 MHz?","answer":"14.347 MHz to 14.350 MHz","sub":"G4D"},{"id":"G4D10","question":"How close to the lower edge of a band\u2019s phone segment should your displayed carrier frequency be when using 3 kHz wide LSB?","answer":"At least 3 kHz above the edge of the segment","sub":"G4D"},{"id":"G4D11","question":"How close to the upper edge of a band\u2019s phone segment should your displayed carrier frequency be when using 3 kHz wide USB?","answer":"At least 3 kHz below the edge of the band","sub":"G4D"},{"id":"G4E01","question":"What is the purpose of a capacitance hat on a mobile antenna?","answer":"To electrically lengthen a physically short antenna","sub":"G4E"},{"id":"G4E02","question":"What is the purpose of a corona ball on an HF mobile antenna?","answer":"To reduce RF voltage discharge from the tip of the antenna while transmitting","sub":"G4E"},{"id":"G4E03","question":"Which of the following direct, fused power connections would be the best for a 100-watt HF mobile installation?","answer":"To the battery using heavy-gauge wire","sub":"G4E"},{"id":"G4E04","question":"Why should DC power for a 100-watt HF transceiver not be supplied by a vehicle\u2019s auxiliary power socket?","answer":"The socket\u2019s wiring may be inadequate for the current drawn by the transceiver","sub":"G4E"},{"id":"G4E05","question":"Which of the following most limits an HF mobile installation?","answer":"Efficiency of the electrically short antenna","sub":"G4E"},{"id":"G4E06","question":"What is one disadvantage of using a shortened mobile antenna as opposed to a full-size antenna?","answer":"Operating bandwidth may be very limited","sub":"G4E"},{"id":"G4E07","question":"Which of the following may cause receive interference to an HF transceiver installed in a vehicle?","answer":"All these choices are correct","sub":"G4E"},{"id":"G4E08","question":"In what configuration are the individual cells in a solar panel connected together?","answer":"Series-parallel","sub":"G4E"},{"id":"G4E09","question":"What is the approximate open-circuit voltage from a fully illuminated silicon photovoltaic cell?","answer":"0.5 VDC","sub":"G4E"},{"id":"G4E10","question":"Why should a series diode be connected between a solar panel and a storage battery that is being charged by the panel?","answer":"To prevent discharge of the battery through the panel during times of low or no illumination","sub":"G4E"},{"id":"G4E11","question":"What precaution should be taken when connecting a solar panel to a lithium iron phosphate battery?","answer":"The solar panel must have a charge controller","sub":"G4E"},{"id":"G5A01","question":"What happens when inductive and capacitive reactance are equal in a series LC circuit?","answer":"Resonance causes impedance to be very low","sub":"G5A"},{"id":"G5A02","question":"What is reactance?","answer":"Opposition to the flow of alternating current caused by capacitance or inductance","sub":"G5A"},{"id":"G5A03","question":"Which of the following is opposition to the flow of alternating current in an inductor?","answer":"Reactance","sub":"G5A"},{"id":"G5A04","question":"Which of the following is opposition to the flow of alternating current in a capacitor?","answer":"Reactance","sub":"G5A"},{"id":"G5A05","question":"How does an inductor react to AC?","answer":"As the frequency of the applied AC increases, the reactance increases","sub":"G5A"},{"id":"G5A06","question":"How does a capacitor react to AC?","answer":"As the frequency of the applied AC increases, the reactance decreases","sub":"G5A"},{"id":"G5A07","question":"What is the term for the inverse of impedance?","answer":"Admittance","sub":"G5A"},{"id":"G5A08","question":"What is impedance?","answer":"The ratio of voltage to current","sub":"G5A"},{"id":"G5A09","question":"What unit is used to measure reactance?","answer":"Ohm","sub":"G5A"},{"id":"G5A10","question":"Which of the following devices can be used for impedance matching at radio frequencies?","answer":"All these choices are correct","sub":"G5A"},{"id":"G5A11","question":"What letter is used to represent reactance?","answer":"X","sub":"G5A"},{"id":"G5A12","question":"What occurs in an LC circuit at resonance?","answer":"Inductive reactance and capacitive reactance cancel","sub":"G5A"},{"id":"G5B01","question":"What dB change represents a factor of two increase or decrease in power?","answer":"Approximately 3 dB","sub":"G5B"},{"id":"G5B02","question":"How does the total current relate to the individual currents in a circuit of parallel resistors?","answer":"It equals the sum of the currents through each branch","sub":"G5B"},{"id":"G5B03","question":"How many watts of electrical power are consumed if 400 VDC is supplied to an 800-ohm load?","answer":"200 watts","sub":"G5B"},{"id":"G5B04","question":"How many watts of electrical power are consumed by a 12 VDC light bulb that draws 0.2 amperes?","answer":"2.4 watts","sub":"G5B"},{"id":"G5B05","question":"How many watts are consumed when a current of 7.0 milliamperes flows through a 1,250-ohm resistance?","answer":"Approximately 61 milliwatts","sub":"G5B"},{"id":"G5B06","question":"What is the PEP produced by 200 volts peak-to-peak across a 50-ohm dummy load?","answer":"100 watts","sub":"G5B"},{"id":"G5B07","question":"What value of an AC signal produces the same power dissipation in a resistor as a DC voltage of the same value?","answer":"The RMS value","sub":"G5B"},{"id":"G5B08","question":"What is the peak-to-peak voltage of a sine wave with an RMS voltage of 120 volts?","answer":"339.4 volts","sub":"G5B"},{"id":"G5B09","question":"What is the RMS voltage of a sine wave with a value of 17 volts peak?","answer":"12 volts","sub":"G5B"},{"id":"G5B10","question":"What percentage of power loss is equivalent to a loss of 1 dB?","answer":"20.6 percent","sub":"G5B"},{"id":"G5B11","question":"What is the ratio of PEP to average power for an unmodulated carrier?","answer":"1.00","sub":"G5B"},{"id":"G5B12","question":"What is the RMS voltage across a 50-ohm dummy load dissipating 1200 watts?","answer":"245 volts","sub":"G5B"},{"id":"G5B13","question":"What is the output PEP of an unmodulated carrier if the average power is 1060 watts?","answer":"1060 watts","sub":"G5B"},{"id":"G5B14","question":"What is the output PEP of 500 volts peak-to-peak across a 50-ohm load?","answer":"625 watts","sub":"G5B"},{"id":"G5C01","question":"What causes a voltage to appear across the secondary winding of a transformer when an AC voltage source is connected across its primary winding?","answer":"Mutual inductance","sub":"G5C"},{"id":"G5C02","question":"What is the output voltage if an input signal is applied to the secondary winding of a 4:1 voltage step-down transformer instead of the primary winding?","answer":"The input voltage is multiplied by 4","sub":"G5C"},{"id":"G5C03","question":"What is the total resistance of a 10-, a 20-, and a 50-ohm resistor connected in parallel?","answer":"5.9 ohms","sub":"G5C"},{"id":"G5C04","question":"What is the approximate total resistance of a 100- and a 200-ohm resistor in parallel?","answer":"67 ohms","sub":"G5C"},{"id":"G5C05","question":"Why is the primary winding wire of a voltage step-up transformer usually a larger size than that of the secondary winding?","answer":"To accommodate the higher current of the primary","sub":"G5C"},{"id":"G5C06","question":"What is the voltage output of a transformer with a 500-turn primary and a 1500-turn secondary when 120 VAC is applied to the primary?","answer":"360 volts","sub":"G5C"},{"id":"G5C07","question":"What transformer turns ratio matches an antenna\u2019s 600-ohm feed point impedance to a 50-ohm coaxial cable?","answer":"3.5 to 1","sub":"G5C"},{"id":"G5C08","question":"What is the equivalent capacitance of two 5.0-nanofarad capacitors and one 750-picofarad capacitor connected in parallel?","answer":"10.750 nanofarads","sub":"G5C"},{"id":"G5C09","question":"What is the capacitance of three 100-microfarad capacitors connected in series?","answer":"33.3 microfarads","sub":"G5C"},{"id":"G5C10","question":"What is the inductance of three 10-millihenry inductors connected in parallel?","answer":"3.3 millihenries","sub":"G5C"},{"id":"G5C11","question":"What is the inductance of a circuit with a 20-millihenry inductor connected in series with a 50-millihenry inductor?","answer":"70 millihenries","sub":"G5C"},{"id":"G5C12","question":"What is the capacitance of a 20-microfarad capacitor connected in series with a 50-microfarad capacitor?","answer":"14.3 microfarads","sub":"G5C"},{"id":"G5C13","question":"Which of the following components should be added to a capacitor to increase the capacitance?","answer":"A capacitor in parallel","sub":"G5C"},{"id":"G5C14","question":"Which of the following components should be added to an inductor to increase the inductance?","answer":"An inductor in series","sub":"G5C"},{"id":"G6A01","question":"What is the minimum allowable discharge voltage for maximum life of a standard 12-volt lead-acid battery?","answer":"10.5 volts","sub":"G6A"},{"id":"G6A02","question":"What is an advantage of batteries with low internal resistance?","answer":"High discharge current","sub":"G6A"},{"id":"G6A03","question":"What is the approximate forward threshold voltage of a germanium diode?","answer":"0.3 volts","sub":"G6A"},{"id":"G6A04","question":"Which of the following is characteristic of an electrolytic capacitor?","answer":"High capacitance for a given volume","sub":"G6A"},{"id":"G6A05","question":"What is the approximate forward threshold voltage of a silicon junction diode?","answer":"0.7 volts","sub":"G6A"},{"id":"G6A06","question":"Why should wire-wound resistors not be used in RF circuits?","answer":"The resistor\u2019s inductance could make circuit performance unpredictable","sub":"G6A"},{"id":"G6A07","question":"What are the operating points for a bipolar transistor used as a switch?","answer":"Saturation and cutoff","sub":"G6A"},{"id":"G6A08","question":"Which of the following is characteristic of low voltage ceramic capacitors?","answer":"Comparatively low cost","sub":"G6A"},{"id":"G6A09","question":"Which of the following describes MOSFET construction?","answer":"The gate is separated from the channel by a thin insulating layer","sub":"G6A"},{"id":"G6A10","question":"Which element of a vacuum tube regulates the flow of electrons between cathode and plate?","answer":"Control grid","sub":"G6A"},{"id":"G6A11","question":"What happens when an inductor is operated above its self-resonant frequency?","answer":"It becomes capacitive","sub":"G6A"},{"id":"G6A12","question":"What is the primary purpose of a screen grid in a vacuum tube?","answer":"To reduce grid-to-plate capacitance","sub":"G6A"},{"id":"G6B01","question":"What determines the performance of a ferrite core at different frequencies?","answer":"The composition, or \u201cmix,\u201d of materials used","sub":"G6B"},{"id":"G6B02","question":"What is meant by the term MMIC?","answer":"Monolithic Microwave Integrated Circuit","sub":"G6B"},{"id":"G6B03","question":"Which of the following is an advantage of CMOS integrated circuits compared to TTL integrated circuits?","answer":"Low power consumption","sub":"G6B"},{"id":"G6B04","question":"What is a typical upper frequency limit for low SWR operation of 50-ohm BNC connectors?","answer":"4 GHz","sub":"G6B"},{"id":"G6B05","question":"What is an advantage of using a ferrite core toroidal inductor?","answer":"All these choices are correct","sub":"G6B"},{"id":"G6B06","question":"What kind of device is an integrated circuit operational amplifier?","answer":"Analog","sub":"G6B"},{"id":"G6B07","question":"Which of the following describes a type N connector?","answer":"A moisture-resistant RF connector useful to 10 GHz","sub":"G6B"},{"id":"G6B08","question":"How is an LED biased when emitting light?","answer":"Forward biased","sub":"G6B"},{"id":"G6B10","question":"How does a ferrite bead or core reduce common-mode RF current on the shield of a coaxial cable?","answer":"By creating an impedance in the current\u2019s path","sub":"G6B"},{"id":"G6B11","question":"What is an SMA connector?","answer":"A small threaded connector suitable for signals up to several GHz","sub":"G6B"},{"id":"G6B12","question":"Which of these connector types is commonly used for low frequency or dc signal connections to a transceiver?","answer":"RCA Phono","sub":"G6B"},{"id":"G7A01","question":"What is the function of a power supply bleeder resistor?","answer":"It discharges the filter capacitors when power is removed","sub":"G7A"},{"id":"G7A02","question":"Which of the following components are used in a power supply filter network?","answer":"Capacitors and inductors","sub":"G7A"},{"id":"G7A03","question":"Which type of rectifier circuit uses two diodes and a center-tapped transformer?","answer":"Full-wave","sub":"G7A"},{"id":"G7A04","question":"What is characteristic of a half-wave rectifier in a power supply?","answer":"Only one diode is required","sub":"G7A"},{"id":"G7A05","question":"What portion of the AC cycle is converted to DC by a half-wave rectifier?","answer":"180 degrees","sub":"G7A"},{"id":"G7A06","question":"What portion of the AC cycle is converted to DC by a full-wave rectifier?","answer":"360 degrees","sub":"G7A"},{"id":"G7A07","question":"What is the output waveform of an unfiltered full-wave rectifier connected to a resistive load?","answer":"A series of DC pulses at twice the frequency of the AC input","sub":"G7A"},{"id":"G7A08","question":"Which of the following is characteristic of a switchmode power supply as compared to a linear power supply?","answer":"High-frequency operation allows the use of smaller components","sub":"G7A"},{"id":"G7A09","question":"Which symbol in figure G7-1 represents a field effect transistor?","answer":"Symbol 1","sub":"G7A"},{"id":"G7A10","question":"Which symbol in figure G7-1 represents a Zener diode?","answer":"Symbol 5","sub":"G7A"},{"id":"G7A11","question":"Which symbol in figure G7-1 represents an NPN junction transistor?","answer":"Symbol 2","sub":"G7A"},{"id":"G7A12","question":"Which symbol in Figure G7-1 represents a solid core transformer?","answer":"Symbol 6","sub":"G7A"},{"id":"G7A13","question":"Which symbol in Figure G7-1 represents a tapped inductor?","answer":"Symbol 7","sub":"G7A"},{"id":"G7B01","question":"What is the purpose of neutralizing an amplifier?","answer":"To eliminate self-oscillations","sub":"G7B"},{"id":"G7B02","question":"Which of these classes of amplifiers has the highest efficiency?","answer":"Class C","sub":"G7B"},{"id":"G7B03","question":"Which of the following describes the function of a two-input AND gate?","answer":"Output is high only when both inputs are high","sub":"G7B"},{"id":"G7B04","question":"In a Class A amplifier, what percentage of the time does the amplifying device conduct?","answer":"100%","sub":"G7B"},{"id":"G7B05","question":"How many states does a 3-bit binary counter have?","answer":"8","sub":"G7B"},{"id":"G7B06","question":"What is a shift register?","answer":"A clocked array of circuits that passes data in steps along the array","sub":"G7B"},{"id":"G7B07","question":"Which of the following are basic components of a sine wave oscillator?","answer":"A filter and an amplifier operating in a feedback loop","sub":"G7B"},{"id":"G7B08","question":"How is the efficiency of an RF power amplifier determined?","answer":"Divide the RF output power by the DC input power","sub":"G7B"},{"id":"G7B09","question":"What determines the frequency of an LC oscillator?","answer":"The inductance and capacitance in the tank circuit","sub":"G7B"},{"id":"G7B10","question":"Which of the following describes a linear amplifier?","answer":"An amplifier in which the output preserves the input waveform","sub":"G7B"},{"id":"G7B11","question":"For which of the following modes is a Class C power stage appropriate for amplifying a modulated signal?","answer":"FM","sub":"G7B"},{"id":"G7C01","question":"What circuit is used to select one of the sidebands from a balanced modulator?","answer":"Filter","sub":"G7C"},{"id":"G7C02","question":"What output is produced by a balanced modulator?","answer":"Double-sideband modulated RF","sub":"G7C"},{"id":"G7C03","question":"What is one reason to use an impedance matching transformer at a transmitter output?","answer":"To present the desired impedance to the transmitter and feed line","sub":"G7C"},{"id":"G7C04","question":"How is a product detector used?","answer":"Used in a single sideband receiver to extract the modulated signal","sub":"G7C"},{"id":"G7C05","question":"Which of the following is characteristic of a direct digital synthesizer (DDS)?","answer":"Variable output frequency with the stability of a crystal oscillator","sub":"G7C"},{"id":"G7C06","question":"Which of the following is an advantage of a digital signal processing (DSP) filter compared to an analog filter?","answer":"A wide range of filter bandwidths and shapes can be created","sub":"G7C"},{"id":"G7C07","question":"What term specifies a filter\u2019s attenuation inside its passband?","answer":"Insertion loss","sub":"G7C"},{"id":"G7C08","question":"Which parameter affects receiver sensitivity?","answer":"All these choices are correct","sub":"G7C"},{"id":"G7C09","question":"What is the phase difference between the I and Q RF signals that software-defined radio (SDR) equipment uses for modulation and demodulation?","answer":"90 degrees","sub":"G7C"},{"id":"G7C10","question":"What is an advantage of using I-Q modulation with software-defined radios (SDRs)?","answer":"All types of modulation can be created with appropriate processing","sub":"G7C"},{"id":"G7C11","question":"Which of these functions is performed by software in a software-defined radio (SDR)?","answer":"All these choices are correct","sub":"G7C"},{"id":"G7C12","question":"What is the frequency above which a low-pass filter\u2019s output power is less than half the input power?","answer":"Cutoff frequency","sub":"G7C"},{"id":"G7C13","question":"What term specifies a filter\u2019s maximum ability to reject signals outside its passband?","answer":"Ultimate rejection","sub":"G7C"},{"id":"G7C14","question":"The bandwidth of a band-pass filter is measured between what two frequencies?","answer":"Upper and lower half-power","sub":"G7C"},{"id":"G8A01","question":"How is direct binary FSK modulation generated?","answer":"By changing an oscillator\u2019s frequency directly with a digital control signal","sub":"G8A"},{"id":"G8A02","question":"What is the name of the process that changes the phase angle of an RF signal to convey information?","answer":"Phase modulation","sub":"G8A"},{"id":"G8A03","question":"What is the name of the process that changes the instantaneous frequency of an RF wave to convey information?","answer":"Frequency modulation","sub":"G8A"},{"id":"G8A04","question":"What emission is produced by a reactance modulator connected to a transmitter RF amplifier stage?","answer":"Phase modulation","sub":"G8A"},{"id":"G8A05","question":"What type of modulation varies the instantaneous power level of the RF signal?","answer":"Amplitude modulation","sub":"G8A"},{"id":"G8A06","question":"Which of the following is characteristic of QPSK31?","answer":"All these choices are correct","sub":"G8A"},{"id":"G8A07","question":"Which of the following phone emissions uses the narrowest bandwidth?","answer":"Single sideband","sub":"G8A"},{"id":"G8A08","question":"Which of the following is an effect of overmodulation?","answer":"Excessive bandwidth","sub":"G8A"},{"id":"G8A09","question":"What type of modulation is used by FT8?","answer":"8-tone frequency shift keying","sub":"G8A"},{"id":"G8A10","question":"What is meant by the term \u201cflat-topping,\u201d when referring to an amplitude-modulated phone signal?","answer":"Signal distortion caused by excessive drive or speech levels","sub":"G8A"},{"id":"G8A11","question":"What is the modulation envelope of an AM signal?","answer":"The waveform created by connecting the peak values of the modulated signal","sub":"G8A"},{"id":"G8A12","question":"What is QPSK modulation?","answer":"Modulation in which digital data is transmitted using 0-, 90-, 180- and 270-degrees phase shift to represent pairs of bits","sub":"G8A"},{"id":"G8A13","question":"What is a link budget?","answer":"The sum of transmit power and antenna gains minus system losses as seen at the receiver","sub":"G8A"},{"id":"G8A14","question":"What is link margin?","answer":"The difference between received power level and minimum required signal level at the input to the receiver","sub":"G8A"},{"id":"G8B01","question":"Which mixer input is varied or tuned to convert signals of different frequencies to an intermediate frequency (IF)?","answer":"Local oscillator","sub":"G8B"},{"id":"G8B02","question":"What is the term for interference from a signal at twice the IF frequency from the desired signal?","answer":"Image response","sub":"G8B"},{"id":"G8B03","question":"What is another term for the mixing of two RF signals?","answer":"Heterodyning","sub":"G8B"},{"id":"G8B04","question":"What is the stage in a VHF FM transmitter that generates a harmonic of a lower frequency signal to reach the desired operating frequency?","answer":"Multiplier","sub":"G8B"},{"id":"G8B05","question":"Which intermodulation products are closest to the original signal frequencies?","answer":"Odd-order","sub":"G8B"},{"id":"G8B06","question":"What is the total bandwidth of an FM phone transmission having 5 kHz deviation and 3 kHz modulating frequency?","answer":"16 kHz","sub":"G8B"},{"id":"G8B07","question":"What is the frequency deviation for a 12.21 MHz reactance modulated oscillator in a 5 kHz deviation, 146.52 MHz FM phone transmitter?","answer":"416.7 Hz","sub":"G8B"},{"id":"G8B08","question":"Why is it important to know the duty cycle of the mode you are using when transmitting?","answer":"Some modes have high duty cycles that could exceed the transmitter\u2019s average power rating","sub":"G8B"},{"id":"G8B09","question":"Why is it good to match receiver bandwidth to the bandwidth of the operating mode?","answer":"It results in the best signal-to-noise ratio","sub":"G8B"},{"id":"G8B10","question":"What is the relationship between transmitted symbol rate and bandwidth?","answer":"Higher symbol rates require wider bandwidth","sub":"G8B"},{"id":"G8B11","question":"What combination of a mixer\u2019s Local Oscillator (LO) and RF input frequencies is found in the output?","answer":"The sum and difference","sub":"G8B"},{"id":"G8B12","question":"What process combines two signals in a non-linear circuit to produce unwanted spurious outputs?","answer":"Intermodulation","sub":"G8B"},{"id":"G8B13","question":"Which of the following is an odd-order intermodulation product of frequencies F1 and F2?","answer":"2F1-F2","sub":"G8B"},{"id":"G8C02","question":"Which digital mode is used as a low-power beacon for assessing HF propagation?","answer":"WSPR","sub":"G8C"},{"id":"G8C03","question":"What part of a packet radio frame contains the routing and handling information?","answer":"Header","sub":"G8C"},{"id":"G8C04","question":"Which of the following describes Baudot code?","answer":"A 5-bit code with additional start and stop bits","sub":"G8C"},{"id":"G8C05","question":"In an ARQ mode, what is meant by a NAK response to a transmitted packet?","answer":"Request retransmission of the packet","sub":"G8C"},{"id":"G8C06","question":"What action results from a failure to exchange information due to excessive transmission attempts when using an ARQ mode?","answer":"The connection is dropped","sub":"G8C"},{"id":"G8C07","question":"Which of the following narrow-band digital modes can receive signals with very low signal-to-noise ratios?","answer":"FT8","sub":"G8C"},{"id":"G8C08","question":"Which of the following statements is true about PSK31?","answer":"Upper case letters use longer Varicode bit sequences and thus slow down transmission","sub":"G8C"},{"id":"G8C09","question":"Which is true of mesh network microwave nodes?","answer":"If one node fails, a packet may still reach its target station via an alternate node","sub":"G8C"},{"id":"G8C10","question":"How does forward error correction (FEC) allow the receiver to correct data errors?","answer":"By transmitting redundant information with the data","sub":"G8C"},{"id":"G8C11","question":"How are the two separate frequencies of a Frequency Shift Keyed (FSK) signal identified?","answer":"Mark and space","sub":"G8C"},{"id":"G8C12","question":"Which type of code is used for sending characters in a PSK31 signal?","answer":"Varicode","sub":"G8C"},{"id":"G8C13","question":"What is indicated on a waterfall display by one or more vertical lines on either side of a data mode or RTTY signal?","answer":"Overmodulation","sub":"G8C"},{"id":"G8C14","question":"Which of the following describes a waterfall display?","answer":"Frequency is horizontal, signal strength is intensity, time is vertical","sub":"G8C"},{"id":"G8C15","question":"What does an FT8 signal report of +3 mean?","answer":"The signal-to-noise ratio is equivalent to +3dB in a 2.5 kHz bandwidth","sub":"G8C"},{"id":"G8C16","question":"Which of the following provide digital voice modes?","answer":"DMR, D-STAR, and SystemFusion","sub":"G8C"},{"id":"G9A01","question":"Which of the following factors determine the characteristic impedance of a parallel conductor feed line?","answer":"The distance between the centers of the conductors and the radius of the conductors","sub":"G9A"},{"id":"G9A02","question":"What is the relationship between high standing wave ratio (SWR) and transmission line loss?","answer":"High SWR increases loss in a lossy transmission line","sub":"G9A"},{"id":"G9A03","question":"What is the nominal characteristic impedance of \u201cwindow line\u201d transmission line?","answer":"450 ohms","sub":"G9A"},{"id":"G9A04","question":"What causes reflected power at an antenna\u2019s feed point?","answer":"A difference between feed line impedance and antenna feed point impedance","sub":"G9A"},{"id":"G9A05","question":"How does the attenuation of coaxial cable change with increasing frequency?","answer":"Attenuation increases","sub":"G9A"},{"id":"G9A06","question":"In what units is RF feed line loss usually expressed?","answer":"Decibels per 100 feet","sub":"G9A"},{"id":"G9A07","question":"What must be done to prevent standing waves on a feed line connected to an antenna?","answer":"The antenna feed point impedance must be matched to the characteristic impedance of the feed line","sub":"G9A"},{"id":"G9A08","question":"If the SWR on an antenna feed line is 5:1, and a matching network at the transmitter end of the feed line is adjusted to present a 1:1 SWR to the transmitter, what is the resulting SWR on the feed line?","answer":"5:1","sub":"G9A"},{"id":"G9A09","question":"What standing wave ratio results from connecting a 50-ohm feed line to a 200-ohm resistive load?","answer":"4:1","sub":"G9A"},{"id":"G9A10","question":"What standing wave ratio results from connecting a 50-ohm feed line to a 10-ohm resistive load?","answer":"5:1","sub":"G9A"},{"id":"G9A11","question":"What is the effect of transmission line loss on SWR measured at the input to the line?","answer":"Higher loss reduces SWR measured at the input to the line","sub":"G9A"},{"id":"G9B01","question":"What is a characteristic of a random-wire HF antenna connected directly to the transmitter?","answer":"Station equipment may carry significant RF current","sub":"G9B"},{"id":"G9B02","question":"Which of the following is a common way to adjust the feed point impedance of an elevated quarter-wave ground-plane vertical antenna to be approximately 50 ohms?","answer":"Slope the radials downward","sub":"G9B"},{"id":"G9B03","question":"Which of the following best describes the radiation pattern of a quarter-wave ground-plane vertical antenna?","answer":"Omnidirectional in azimuth","sub":"G9B"},{"id":"G9B04","question":"What is the radiation pattern of a dipole antenna in free space in a plane containing the conductor?","answer":"It is a figure-eight at right angles to the antenna","sub":"G9B"},{"id":"G9B05","question":"How does antenna height affect the azimuthal radiation pattern of a horizontal dipole HF antenna at elevation angles higher than about 45 degrees?","answer":"If the antenna is less than 1/2 wavelength high, the azimuthal pattern is almost omnidirectional","sub":"G9B"},{"id":"G9B06","question":"Where should the radial wires of a ground-mounted vertical antenna system be placed?","answer":"On the surface or buried a few inches below the ground","sub":"G9B"},{"id":"G9B07","question":"How does the feed point impedance of a horizontal 1/2 wave dipole antenna change as the antenna height is reduced to 1/10 wavelength above ground?","answer":"It steadily decreases","sub":"G9B"},{"id":"G9B08","question":"How does the feed point impedance of a 1/2 wave dipole change as the feed point is moved from the center toward the ends?","answer":"It steadily increases","sub":"G9B"},{"id":"G9B09","question":"Which of the following is an advantage of using a horizontally polarized as compared to a vertically polarized HF antenna?","answer":"Lower ground losses","sub":"G9B"},{"id":"G9B10","question":"What is the approximate length for a 1/2 wave dipole antenna cut for 14.250 MHz?","answer":"33 feet","sub":"G9B"},{"id":"G9B11","question":"What is the approximate length for a 1/2 wave dipole antenna cut for 3.550 MHz?","answer":"132 feet","sub":"G9B"},{"id":"G9B12","question":"What is the approximate length for a 1/4 wave monopole antenna cut for 28.5 MHz?","answer":"8 feet","sub":"G9B"},{"id":"G9C01","question":"Which of the following would increase the bandwidth of a Yagi antenna?","answer":"Larger-diameter elements","sub":"G9C"},{"id":"G9C02","question":"What is the approximate length of the driven element of a Yagi antenna?","answer":"1/2 wavelength","sub":"G9C"},{"id":"G9C03","question":"How do the lengths of a three-element Yagi reflector and director compare to that of the driven element?","answer":"The reflector is longer, and the director is shorter","sub":"G9C"},{"id":"G9C04","question":"How does antenna gain in dBi compare to gain stated in dBd for the same antenna?","answer":"Gain in dBi is 2.15 dB higher","sub":"G9C"},{"id":"G9C05","question":"What is the primary effect of increasing boom length and adding directors to a Yagi antenna?","answer":"Gain increases","sub":"G9C"},{"id":"G9C07","question":"What does \u201cfront-to-back ratio\u201d mean in reference to a Yagi antenna?","answer":"The power radiated in the major lobe compared to that in the opposite direction","sub":"G9C"},{"id":"G9C08","question":"What is meant by the \u201cmain lobe\u201d of a directive antenna?","answer":"The direction of maximum radiated field strength from the antenna","sub":"G9C"},{"id":"G9C09","question":"In free space, how does the gain of two three-element, horizontally polarized Yagi antennas spaced vertically 1/2 wavelength apart typically compare to the gain of a single three-element Yagi?","answer":"Approximately 3 dB higher","sub":"G9C"},{"id":"G9C10","question":"Which of the following can be adjusted to optimize forward gain, front-to-back ratio, or SWR bandwidth of a Yagi antenna?","answer":"All these choices are correct","sub":"G9C"},{"id":"G9C11","question":"What is a beta or hairpin match?","answer":"A shorted transmission line stub placed at the feed point of a Yagi antenna to provide impedance matching","sub":"G9C"},{"id":"G9C12","question":"Which of the following is a characteristic of using a gamma match with a Yagi antenna?","answer":"It does not require the driven element to be insulated from the boom","sub":"G9C"},{"id":"G9D01","question":"Which of the following antenna types will be most effective as a near vertical incidence skywave (NVIS) antenna for short-skip communications on 40 meters during the day?","answer":"A horizontal dipole placed between 1/10 and 1/4 wavelength above the ground","sub":"G9D"},{"id":"G9D02","question":"What is the feed point impedance of an end-fed half-wave antenna?","answer":"Very high","sub":"G9D"},{"id":"G9D03","question":"In which direction is the maximum radiation from a VHF/UHF \u201chalo\u201d antenna?","answer":"Omnidirectional in the plane of the halo","sub":"G9D"},{"id":"G9D04","question":"What is the primary function of antenna traps?","answer":"To enable multiband operation","sub":"G9D"},{"id":"G9D05","question":"What is an advantage of vertically stacking horizontally polarized Yagi antennas?","answer":"It narrows the main lobe in elevation","sub":"G9D"},{"id":"G9D06","question":"Which of the following is an advantage of a log-periodic antenna?","answer":"Wide bandwidth","sub":"G9D"},{"id":"G9D07","question":"Which of the following describes a log-periodic antenna?","answer":"Element length and spacing vary logarithmically along the boom","sub":"G9D"},{"id":"G9D08","question":"How does a \u201cscrewdriver\u201d mobile antenna adjust its feed point impedance?","answer":"By varying the base loading inductance","sub":"G9D"},{"id":"G9D09","question":"What is the primary use of a Beverage antenna?","answer":"Directional receiving for MF and low HF bands","sub":"G9D"},{"id":"G9D10","question":"In which direction or directions does an electrically small loop (less than 1/10 wavelength in circumference) have nulls in its radiation pattern?","answer":"Broadside to the loop","sub":"G9D"},{"id":"G9D11","question":"Which of the following is a disadvantage of multiband antennas?","answer":"They have poor harmonic rejection","sub":"G9D"},{"id":"G9D12","question":"What is the common name of a dipole with a single central support?","answer":"Inverted V","sub":"G9D"},{"id":"G0A01","question":"What is one way that RF energy can affect human body tissue?","answer":"It heats body tissue","sub":"G0A"},{"id":"G0A02","question":"Which of the following is used to determine RF exposure from a transmitted signal?","answer":"All these choices are correct","sub":"G0A"},{"id":"G0A03","question":"How can you determine that your station complies with FCC RF exposure regulations?","answer":"All these choices are correct","sub":"G0A"},{"id":"G0A04","question":"What does \u201ctime averaging\u201d mean when evaluating RF radiation exposure?","answer":"The total RF exposure averaged over a certain period","sub":"G0A"},{"id":"G0A05","question":"What must you do if an evaluation of your station shows that the RF energy radiated by your station exceeds permissible limits for possible human absorption?","answer":"Take action to prevent human exposure to the excessive RF fields","sub":"G0A"},{"id":"G0A06","question":"What must you do if your station fails to meet the FCC RF exposure exemption criteria?","answer":"Perform an RF exposure evaluation in accordance with FCC OET Bulletin 65","sub":"G0A"},{"id":"G0A07","question":"What is the effect of modulation duty cycle on RF exposure?","answer":"A lower duty cycle permits greater power levels to be transmitted","sub":"G0A"},{"id":"G0A08","question":"Which of the following steps must an amateur operator take to ensure compliance with RF safety regulations?","answer":"Perform a routine RF exposure evaluation and prevent access to any identified high exposure areas","sub":"G0A"},{"id":"G0A09","question":"What type of instrument can be used to accurately measure an RF field strength?","answer":"A calibrated field strength meter with a calibrated antenna","sub":"G0A"},{"id":"G0A10","question":"What should be done if evaluation shows that a neighbor might experience more than the allowable limit of RF exposure from the main lobe of a directional antenna?","answer":"Take precautions to ensure that the antenna cannot be pointed in their direction when they are present","sub":"G0A"},{"id":"G0A11","question":"What precaution should be taken if you install an indoor transmitting antenna?","answer":"Make sure that MPE limits are not exceeded in occupied areas","sub":"G0A"},{"id":"G0A12","question":"What stations are subject to the FCC rules on RF exposure?","answer":"All stations with a time-averaged transmission of more than one milliwatt","sub":"G0A"},{"id":"G0B01","question":"Which wire or wires in a four-conductor 240 VAC circuit should be attached to fuses or circuit breakers?","answer":"Only the hot wires","sub":"G0B"},{"id":"G0B02","question":"According to the National Electrical Code, what is the minimum wire size that may be used safely for wiring with a 20-ampere circuit breaker?","answer":"AWG number 12","sub":"G0B"},{"id":"G0B03","question":"Which size of fuse or circuit breaker would be appropriate to use with a circuit that uses AWG number 14 wiring?","answer":"15 amperes","sub":"G0B"},{"id":"G0B04","question":"Where should the station\u2019s lightning protection ground system be located?","answer":"Outside the building","sub":"G0B"},{"id":"G0B05","question":"Which of the following conditions will cause a ground fault circuit interrupter (GFCI) to disconnect AC power?","answer":"Current flowing from one or more of the hot wires directly to ground","sub":"G0B"},{"id":"G0B06","question":"Which of the following is covered by the National Electrical Code?","answer":"Electrical safety of the station","sub":"G0B"},{"id":"G0B07","question":"Which of these choices should be observed when climbing a tower using a safety harness?","answer":"Confirm that the harness is rated for the weight of the climber and that it is within its allowable service life","sub":"G0B"},{"id":"G0B08","question":"What should be done before climbing a tower that supports electrically powered devices?","answer":"Make sure all circuits that supply power to the tower are locked out and tagged","sub":"G0B"},{"id":"G0B09","question":"Which of the following is true of an emergency generator installation?","answer":"The generator should be operated in a well-ventilated area","sub":"G0B"},{"id":"G0B10","question":"Which of the following is a danger from lead-tin solder?","answer":"Lead can contaminate food if hands are not washed carefully after handling the solder","sub":"G0B"},{"id":"G0B11","question":"Which of the following is required for lightning protection ground rods?","answer":"They must be bonded together with all other grounds","sub":"G0B"},{"id":"G0B12","question":"What is the purpose of a power supply interlock?","answer":"To ensure that dangerous voltages are removed if the cabinet is opened","sub":"G0B"},{"id":"G0B13","question":"Where should lightning arrestors be located?","answer":"Where the feed lines enter the building","sub":"G0B"}];
let pool = [...CARDS];
let idx = 0;
function show(){
  if(!pool.length) return;
  const c = pool[idx];
  document.getElementById("question").textContent = c.question;
  document.getElementById("answer").textContent = c.answer;
  document.getElementById("answer").classList.remove("show");
  document.getElementById("revealBtn").textContent = "Show Answer";
  document.getElementById("stats").textContent = `Card ${idx+1} of ${pool.length}`;
  document.getElementById("meta").textContent = c.id + " (" + c.sub + ")";
}
document.getElementById("revealBtn").onclick = () => {
  document.getElementById("answer").classList.add("show");
  document.getElementById("revealBtn").textContent = "Answer Shown";
};
document.getElementById("nextBtn").onclick = () => {
  idx = (idx + 1) % pool.length;
  show();
};
document.getElementById("shuffleBtn").onclick = () => {
  for(let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  idx = 0;
  show();
};
document.getElementById("restartBtn").onclick = () => {
  pool = [...CARDS];
  idx = 0;
  show();
};
show();
</script>
